name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.1'
          cache: false
      - name: Format, vet, race and installer tests
        run: make check test build
      - name: Read image version
        id: version
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          assert re.fullmatch(r'0\.[0-9]+\.[0-9]+', version)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'value={version}\n')
          PY
      - name: CLI HTTP and frontend syntax
        run: |
          python3 scripts/test-http-cli.py
          node --check internal/httpserver/web/app.js
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build complete Dockerfile without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: redapp:ci
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}
      - name: Test built Docker image
        env:
          REDAPP_TEST_IMAGE: redapp:ci
        run: |
          docker run --rm --network none redapp:ci version
          sh scripts/test-docker-local.sh
