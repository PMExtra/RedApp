name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test and build frontend once
        run: |
          make frontend-test
          (cd frontend && npm exec -- vite build)
          git diff --exit-code -- internal/httpserver/web
          mkdir frontend-artifact
          tar -czf frontend-artifact/web.tar.gz -C internal/httpserver web
          cd frontend-artifact
          sha256sum web.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-${{ github.sha }}
          path: frontend-artifact/
          retention-days: 3
          if-no-files-found: error
          overwrite: true

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # A pull request checks out its merge commit; depth 2 also fetches the base parent.
          fetch-depth: 2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
          cache: true
      - name: Format, vet, docs, race and installer tests
        run: make check test
      - name: Require both languages of changed user docs
        if: github.event_name == 'pull_request' && matrix.arch == 'amd64'
        run: python3 scripts/check-docs.py --base HEAD^1
      - name: Build and exercise Shell-only installer validation image
        if: matrix.arch == 'amd64'
        run: |
          docker build -t installer-validator -f .github/installer-check/Dockerfile .github/installer-check
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 256 --memory 1g \
            --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,exec,size=512m \
            -e HOME=/tmp -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            installer-validator python3 /src/scripts/test-installers.py --platform shell

  runtime:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/redapp-native-go
          key: native-go-linux-${{ matrix.arch }}-trixie-1.27.1-8f58fd67ea075142-${{ hashFiles('go.sum') }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-${{ github.sha }}
          path: frontend-artifact
      - name: Verify frontend and build native binary once
        env:
          REDAPP_NATIVE_CACHE: ${{ runner.temp }}/redapp-native-go
        run: |
          (cd frontend-artifact && sha256sum -c SHA256SUMS)
          tar -xzf frontend-artifact/web.tar.gz -C internal/httpserver
          git diff --exit-code -- internal/httpserver/web
          sh scripts/build-native-container.sh "$(cat VERSION)" "$GITHUB_SHA"
          test "$(bin/redapp version)" = "RedApp $(cat VERSION) (commit $GITHUB_SHA)"
      - name: Real HTTP, data, instruction and configuration maintenance CLI
        run: make runtime-test
      - name: Package and test exact native runtime image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p runtime-input/data runtime-artifact
          cp bin/redapp runtime-input/redapp
          cp /etc/ssl/certs/ca-certificates.crt runtime-input/ca-certificates.crt
          chmod 0700 runtime-input/data
          image="redapp:ci-$GITHUB_SHA-$ARCH"
          docker build --platform "linux/$ARCH" -f .github/runtime/Dockerfile \
            --build-arg VERSION="$(cat VERSION)" --build-arg REVISION="$GITHUB_SHA" \
            -t "$image" runtime-input
          test "$(docker run --rm --network none "$image" version)" = "RedApp $(cat VERSION) (commit $GITHUB_SHA)"
          REDAPP_TEST_IMAGE="$image" REDAPP_TEST_PLATFORM="linux/$ARCH" sh scripts/test-docker-local.sh
          if [ "$ARCH" = amd64 ]; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y qemu-user binutils
            python3 scripts/test-cpu-baseline.py --image "$image" --version "$(cat VERSION)" --revision "$GITHUB_SHA"
          fi
          python3 scripts/ci-image-artifact.py record runtime-artifact "$(cat VERSION)" "$GITHUB_SHA" "$ARCH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.repository == 'PMExtra/RedApp' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: runtime-${{ github.sha }}-${{ matrix.arch }}
          path: runtime-artifact/
          retention-days: 3
          if-no-files-found: error
          overwrite: true
          compression-level: 0

  windows-installers:
    uses: ./.github/workflows/windows-installers.yml
    with:
      revision: ${{ github.sha }}
