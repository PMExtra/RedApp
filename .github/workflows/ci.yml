name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - name: Frontend typecheck and DOM tests
        run: make frontend-test
      - name: Format, vet, race and installer tests
        run: make check test build
      - name: Read image version
        id: version
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          assert re.fullmatch(r'0\.[0-9]+\.[0-9]+', version)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'value={version}\n')
          PY
      - name: CLI HTTP and frontend syntax
        run: |
          python3 scripts/test-data-cli.py
          python3 scripts/test-http-cli.py
          git diff --exit-code -- internal/httpserver/web
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build complete Dockerfile without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: redapp:ci
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}
      - name: Test built Docker image
        env:
          REDAPP_TEST_IMAGE: redapp:ci
          REDAPP_TEST_PLATFORM: linux/${{ matrix.arch }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          test "$(docker run --rm --network none redapp:ci version)" = "RedApp $RELEASE_VERSION (commit $GITHUB_SHA)"
          sh scripts/test-docker-local.sh

  windows-installers:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Parse both enterprise PowerShell installers
        shell: pwsh
        run: |
          foreach ($file in @('installers/codex/generated/install.ps1', 'installers/claude-code/generated/install.ps1')) {
            $errors = $null; $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | Write-Error; exit 1 }
          }
      - name: Test Claude installation with harmless Windows executable
        shell: pwsh
        run: |
          python scripts/test-claude-installers-windows.py --shell pwsh
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/test-claude-installers-windows.py --shell powershell.exe
          exit $LASTEXITCODE
