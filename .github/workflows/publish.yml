name: Publish image

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: ghcr-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'PMExtra/RedApp' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate version and successful main CI
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          tag = os.environ['GITHUB_REF_NAME']
          assert re.fullmatch(r'0\.[0-9]+\.[0-9]+', version), 'Only stable pre-1.0 releases are configured'
          assert tag == 'v' + version, 'Tag does not match VERSION'
          repo, sha = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']
          url = f'https://api.github.com/repos/{repo}/actions/workflows/ci.yml/runs?head_sha={sha}&event=push&per_page=20'
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
          with urllib.request.urlopen(request, timeout=30) as response:
              runs = json.load(response)['workflow_runs']
          assert any(run['head_branch'] == 'main' and run['head_sha'] == sha and run['conclusion'] == 'success' for run in runs), 'Exact commit must pass main CI before publishing'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\nseries={".".join(version.split(".")[:2])}\n')
          PY
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish Linux amd64 and arm64
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/pmextra/redapp:v${{ steps.release.outputs.version }}
            ghcr.io/pmextra/redapp:${{ steps.release.outputs.version }}
            ghcr.io/pmextra/redapp:${{ steps.release.outputs.series }}
            ghcr.io/pmextra/redapp:latest
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            REVISION=${{ github.sha }}
      - name: Verify manifest and run both published architectures
        env:
          REDAPP_TEST_IMAGE: ghcr.io/pmextra/redapp@${{ steps.image.outputs.digest }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          export RELEASE_REVISION="$GITHUB_SHA"
          sh scripts/verify-published.sh
          printf '镜像：`%s`\n' "$REDAPP_TEST_IMAGE" >> "$GITHUB_STEP_SUMMARY"
