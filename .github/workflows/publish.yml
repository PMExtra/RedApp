name: Publish image

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: ghcr-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'PMExtra/RedApp' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select exact successful main CI and retained artifacts
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/select-release-ci.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: runtime-${{ github.sha }}-amd64
          path: artifacts/amd64
          run-id: ${{ steps.release.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: runtime-${{ github.sha }}-arm64
          path: artifacts/arm64
          run-id: ${{ steps.release.outputs.run_id }}
          github-token: ${{ github.token }}
      # The package post-install scripts reset binfmt registrations. Install it
      # before the Docker ARM interpreter so that cross-architecture checks work.
      - name: Install low-ISA validation tools before registering Docker emulation
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-user binutils
      # The binfmt image runs privileged; pin it instead of the action's floating default.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      # Only imagetools is used: the docker driver avoids booting a floating BuildKit container.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push tested variants and assemble candidate without rebuilding
        id: candidate
        run: |
          version=$(cat VERSION)
          for arch in amd64 arm64; do
            python3 scripts/ci-image-artifact.py verify "artifacts/$arch" "$version" "$GITHUB_SHA" "$arch"
            docker tag "redapp:ci-$GITHUB_SHA-$arch" "ghcr.io/pmextra/redapp:ci-$GITHUB_SHA-$arch"
            docker push "ghcr.io/pmextra/redapp:ci-$GITHUB_SHA-$arch"
          done
          docker buildx imagetools create --tag "ghcr.io/pmextra/redapp:candidate-$GITHUB_SHA" \
            "ghcr.io/pmextra/redapp:ci-$GITHUB_SHA-amd64" "ghcr.io/pmextra/redapp:ci-$GITHUB_SHA-arm64"
          digest=$(docker buildx imagetools inspect "ghcr.io/pmextra/redapp:candidate-$GITHUB_SHA" --format '{{.Manifest.Digest}}')
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Verify immutable candidate on both architectures before stable tags
        env:
          REDAPP_TEST_IMAGE: ghcr.io/pmextra/redapp@${{ steps.candidate.outputs.digest }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          export RELEASE_REVISION="$GITHUB_SHA"
          sh scripts/verify-published.sh
      - name: Promote verified manifest, protecting existing releases and current main
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.candidate.outputs.digest }}
        run: python3 scripts/promote-release-image.py
