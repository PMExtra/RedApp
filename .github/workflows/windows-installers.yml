name: Windows installer contracts

on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
      artifact:
        default: ''
        type: string
      bundle_sha256:
        default: ''
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: inputs.artifact != ''
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/installer-bundle
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Export trusted preset inventory before installer validation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .generated | Out-Null
          go run ./cmd/preset-inventory | Set-Content -Encoding utf8 .generated/installer-inventory.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Validate exact installer candidate with PowerShell 7 and 5.1
        shell: pwsh
        env:
          CANDIDATE_ARTIFACT: ${{ inputs.artifact }}
          CANDIDATE_SHA256: ${{ inputs.bundle_sha256 }}
          BASELINE_SHA: ${{ inputs.revision }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          $guard = [guid]::NewGuid().ToString('N')
          Write-Output "::stop-commands::$guard"
          try {
            if ($env:CANDIDATE_ARTIFACT) {
              python scripts/test-installers.py --platform windows --bundle "$env:RUNNER_TEMP/installer-bundle/installer-update.zip" --sha256 $env:CANDIDATE_SHA256 --baseline $env:BASELINE_SHA
            } else {
              python scripts/test-installer-candidates.py
            }
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } finally { Write-Output "::$guard::" }
