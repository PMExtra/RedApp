      summary: List applications, optionally of one vendor, with sorting.
      description: |
        `q` matches application ID, `vendor/app` key, both names and tags (tags: case-folded NFC substring).
        Sorting happens over all matching applications before paging; ties are broken by key and missing
        values always sort last regardless of `order`.
        `version`/`updated` use the newest locally known version of the current source epoch (protocol order);
        `downloads` uses the lifetime `counters.download_success` (only `http-cache`, `codex`, `claude-code`).
      parameters:
        - name: vendor
          in: query
          description: Restrict to one vendor (deleted vendors allowed).
          schema:
