        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: patchAppConfiguration
      tags: [configuration]
      summary: Set or reset fields of an application configuration.
      description: |
        Same semantics as `patchVendorConfiguration`. Additional rules:

        - Paths must apply to the provider (`base_url` only for `codex`/`claude-code`; `base_urls`, `source_strategy`
          and `http_policy.*` only for `http-cache`; `retention`/`prewarm` only for `codex`/`claude-code`;
          `cache_ttl_seconds` not for `info`/`hosted`). Otherwise `400 VALIDATION_FAILED`.
        - `proxy`, `prewarm`, `retention`, `base_urls`, `categories`, `tags` and each `http_policy.*` list replace the
          whole value.
        - `new_categories` (typed category names) are resolved to existing categories by name or created, and added to
          `set.categories`, which must then be present. A name matching several categories returns `409 CATEGORY_AMBIGUOUS`.
        - Changing `base_url`, `base_urls` or `source_strategy` starts a new source epoch: new requests use only the new
          source; old cache entries stay on disk for manual cleanup.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      security:
        - sessionCookie: []
          csrfToken: []
      x-max-body-bytes: 262144
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppConfigurationPatch'
            examples:
              cachePolicy:
                summary: Replace the HTTP cache rules and reset automatic cleanup to the template.
                value:
                  set:
                    http_policy.stale_fallback: true
                    http_policy.rules:
                      - match: {type: glob, pattern: /releases/}
                        ttl_seconds: 3600
                      - match: {type: re2, pattern: '/channels/[^/]+\.json'}
                        ttl_seconds: 0
                  unset: [http_policy.auto_cleanup]
              taxonomy:
                summary: Assign categories, creating "Developer tools" if no category has that name.
                value:
                  set:
                    categories: [ai]
                    tags: [cli, agent]
                  new_categories: [Developer tools]
              instructions:
                value:
                  set:
                    instructions.en: "## Install\n\n```sh\ncurl -fsSL '{{base_url}}{{app_path}}/install.sh' | sh\n```"
              resetToTemplate:
                value:
                  unset: [name.en, name.zh-CN, icon, retention]
      x-error-codes: [APPLICATION_NOT_FOUND, VALIDATION_FAILED, PROXY_REDACTED_MISMATCH, CATEGORY_AMBIGUOUS, ENTITY_DELETED]
