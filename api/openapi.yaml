  schemas:
    # ------------------------------------------------------------ primitives
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id, retryable]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: English, user-facing; never contains internal paths, SQL or credentials.
            request_id:
              type: string
              pattern: '^[0-9a-f]{16}$'
            retryable:
              type: boolean
              description: The same request may succeed later without changes.
    ErrorCode:
      type: string
      description: Stable error code; see `components.x-error-codes`.
      enum:
        - INVALID_REQUEST
        - VALIDATION_FAILED
        - INVALID_QUERY
        - INVALID_CURSOR
        - INVALID_PATH
        - REQUEST_ORIGIN_INVALID
        - IF_MATCH_REQUIRED
        - CURRENT_PASSWORD_INCORRECT
        - PASSWORD_INVALID
        - PROXY_REDACTED_MISMATCH
        - ICON_INVALID
        - PACKAGE_INVALID
        - INSTRUCTIONS_TRUST_REQUIRED
        - AUTH_REQUIRED
        - LOGIN_FAILED
        - ORIGIN_REJECTED
        - CSRF_REJECTED
        - NOT_FOUND
        - VENDOR_NOT_FOUND
        - APPLICATION_NOT_FOUND
        - CATEGORY_NOT_FOUND
        - FILE_NOT_FOUND
        - SOURCE_NOT_FOUND
        - PREVIEW_NOT_FOUND
        - JOB_NOT_FOUND
        - TRANSFER_NOT_FOUND
        - CACHE_ENTRY_NOT_FOUND
        - CAPABILITY_UNSUPPORTED
        - METHOD_NOT_ALLOWED
        - REVISION_CONFLICT
        - ALREADY_EXISTS
        - VENDOR_NOT_EMPTY
        - BUILTIN_PROTECTED
        - ENTITY_DELETED
        - APPLICATION_DELETE_PENDING
        - CATEGORY_AMBIGUOUS
        - FILE_CONFLICT
        - TRANSFER_ID_IN_USE
        - TRANSFER_CANCELLED
        - PREVIEW_STALE
        - OPERATION_IN_PROGRESS
        - SOURCE_CHANGED
        - IMPORT_NOT_READY
        - PREWARM_BUSY
        - PREWARM_REQUEST_CONFLICT
        - ARTIFACT_TOO_LARGE
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - LOGIN_RATE_LIMITED
        - PREVIEW_LIMIT_EXCEEDED
        - INTERNAL_ERROR
        - UPSTREAM_UNAVAILABLE
        - METADATA_UNTRUSTED
        - CHANNELS_UNVERIFIED
        - IMPORT_SOURCE_FAILED
        - STORAGE_UNAVAILABLE
        - NOT_READY
        - SESSION_LIMIT_EXCEEDED
        - TRANSFER_CAPACITY
        - CACHE_CONTENDED
        - PREVIEW_BUSY
        - INSTALLER_UNAVAILABLE
        - CACHE_MISS
    Uid:
      type: string
      description: 32 lowercase hex characters.
      pattern: '^[0-9a-f]{32}$'
    Revision:
      type: integer
      format: int64
      minimum: 1
      description: Optimistic concurrency revision; also sent as `ETag`.
    Slug:
      type: string
      description: Lowercase letters, digits and single hyphens.
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      maxLength: 63
    VendorId:
      description: Vendor ID; `admin`, `api`, `assets`, `health` and `all` are reserved.
      allOf:
        - $ref: '#/components/schemas/Slug'
        - not:
            enum: [admin, api, assets, health, all]
    AppKey:
      type: string
      description: '`<vendor>/<app>`.'
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*/[a-z0-9]+(?:-[a-z0-9]+)*$'
      maxLength: 127
    Language:
      type: string
      enum: [en, zh-CN]
    LocalizedText:
      type: object
      additionalProperties: false
      required: [en, zh-CN]
      properties:
        en:
          type: string
        zh-CN:
          type: string
    LocalizedFlags:
      type: object
      additionalProperties: false
      required: [en, zh-CN]
      properties:
        en:
          type: boolean
        zh-CN:
          type: boolean
    IconPath:
      type: string
      description: Site-absolute icon path (`/assets/icons/...` uploaded, `/assets/presets/...` embedded) or `""` for none.
      pattern: '^(|/assets/icons/[0-9a-f]{64}\.(png|jpg|svg)|/assets/presets/[a-z0-9][a-z0-9/._-]*\.(svg|png|jpg))$'
    ProviderKey:
      type: string
      enum: [info, hosted, http-cache, codex, claude-code]
    SourceStrategy:
      type: string
      enum: [ordered, round_robin, random]
      description: '`ordered` tries sources in order; `round_robin` starts at the next source each time; `random` tries each once in random order.'
    DirectoryState:
      type: string
      enum: [current, enabled, disabled, deleted]
      default: current
      description: |
        `current`: not deleted. `enabled`: vendor enabled with at least one enabled application (vendors) /
        published (applications). `disabled`: the object or one of its applications is disabled. `deleted`: deleted
        objects, or vendors with deleted applications.
    HttpUrl:
      type: string
      format: uri
      maxLength: 4096
      pattern: '^https?://'
      description: Absolute http(s) URL without credentials, query or fragment.
    PathMatch:
      type: object
      additionalProperties: false
      required: [type, pattern]
      description: |
        Application-relative path matcher. `glob` uses doublestar syntax and a pattern matching a directory also matches
        everything below it; `re2` must match the whole decoded path.
      properties:
        type:
          type: string
          enum: [glob, re2]
        pattern:
          type: string
          minLength: 1
          maxLength: 1024
          description: At most 1024 UTF-8 bytes.
    ProxyConfig:
      type: object
      additionalProperties: false
      required: [mode]
      description: |
        `inherit` uses the parent scope, `direct` connects without a proxy, `url` uses `url`
        (`http`, `https` or `socks5`, explicit port, optional percent-encoded credentials, no path/query/fragment).
        In responses a saved password is shown as `****`; submitting `****` keeps it (see `PROXY_REDACTED_MISMATCH`).
      properties:
        mode:
          type: string
          enum: [inherit, direct, url]
        url:
          type: string
          maxLength: 4096
          description: "Required with and only allowed with `mode: url`."
      if:
        properties:
          mode:
            const: url
      then:
        required: [url]
      else:
        not:
          required: [url]
    ProxyEffective:
      type: object
      additionalProperties: false
      required: [mode, source_scope, source_id, dns]
      description: Resolved proxy after inheritance (application → vendor → global; unset global is direct).
      properties:
        mode:
          type: string
          enum: [direct, url]
        url:
          type: string
          description: Redacted URL when `mode` is `url`.
        source_scope:
          type: string
          enum: [app, vendor, global]
        source_id:
          type: string
          description: Key of the scope that supplied the setting (`vendor/app`, vendor ID, or `""` for global).
        dns:
          type: string
          enum: [local, proxy]
          description: '`proxy` when the proxy resolves host names (all `url` modes).'
    HealthStatus:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true
    PageMeta:
      type: object
      description: Common fields of page-style lists (documentation only; each page schema repeats them).
      required: [page, limit, total, total_pages]
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
        total_pages:
          type: integer
          minimum: 1
    NextCursor:
      description: Cursor of the next page, `null` on the last page.
      type: [string, 'null']
      maxLength: 2048

    # ------------------------------------------------------------ public
    Bootstrap:
      type: object
      additionalProperties: false
      required: [version, os, arch, site, public_url, revision]
      properties:
        version:
          type: string
          description: Build version, `dev` for unversioned builds.
        os:
          type: string
          examples: [linux]
        arch:
          type: string
          examples: [amd64]
        site:
          $ref: '#/components/schemas/SiteSettings'
        public_url:
          type: string
          description: Effective public URL (origin, no trailing `/`) for generated links.
        revision:
          type: string
          description: Opaque digest of everything above plus the category taxonomy; changes when any of it changes.
    PublicVendor:
      type: object
      additionalProperties: false
      required: [id, name, description, icon, localized_icons]
      properties:
        id:
          $ref: '#/components/schemas/VendorId'
        name:
          $ref: '#/components/schemas/LocalizedText'
        description:
          $ref: '#/components/schemas/LocalizedText'
        icon:
          $ref: '#/components/schemas/IconPath'
        localized_icons:
          $ref: '#/components/schemas/LocalizedIcons'
    LocalizedIcons:
      type: object
      additionalProperties: false
      required: [en, zh-CN]
      description: Per-language vendor logo; `""` falls back to `icon`.
      properties:
        en:
          $ref: '#/components/schemas/IconPath'
        zh-CN:
          $ref: '#/components/schemas/IconPath'
    CategoryLabel:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/Slug'
        name:
          $ref: '#/components/schemas/LocalizedText'
    CategoryCount:
      type: object
      additionalProperties: false
      required: [id, name, count]
      properties:
        id:
          $ref: '#/components/schemas/Slug'
        name:
          $ref: '#/components/schemas/LocalizedText'
        count:
          type: integer
          minimum: 0
          description: Published applications in this category.
    Capabilities:
      type: object
      additionalProperties: false
      required: [details, instructions, hosted_files, files, versions, installers, time_cleanup]
      properties:
        details:
          type: boolean
        instructions:
          type: boolean
        hosted_files:
          type: boolean
          description: Administrators manage files (`hosted`).
        files:
          type: boolean
          description: Serves files below `/<vendor>/<app>/`.
        versions:
          type: boolean
          description: Release versions, resources, retention and prewarm (`codex`, `claude-code`).
        installers:
          type: boolean
          description: Serves `install.sh` and `install.ps1`.
        time_cleanup:
          type: boolean
          description: Pattern/time based cache cleanup and refresh (`http-cache`).
    LatestKnownVersion:
      type: object
      additionalProperties: false
      required: [version, first_seen]
      description: Newest locally observed version of the current source epoch; RedApp never contacts the upstream for it.
      properties:
        version:
          type: string
        first_seen:
          type: [string, 'null']
          format: date-time
    PublicApp:
      type: object
      additionalProperties: false
      required: [key, id, vendor, name, description, icon, provider, capabilities, categories, latest_known_version, instructions_available, revision]
      properties:
        key:
          $ref: '#/components/schemas/AppKey'
        id:
          $ref: '#/components/schemas/Slug'
        vendor:
          $ref: '#/components/schemas/PublicVendor'
        name:
          $ref: '#/components/schemas/LocalizedText'
        description:
          $ref: '#/components/schemas/LocalizedText'
        icon:
          $ref: '#/components/schemas/IconPath'
        provider:
          $ref: '#/components/schemas/ProviderKey'
        capabilities:
          $ref: '#/components/schemas/Capabilities'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryLabel'
        latest_known_version:
          description: '`null` when no version is known or the provider has no versions.'
          oneOf:
            - $ref: '#/components/schemas/LatestKnownVersion'
            - type: 'null'
        instructions_available:
          $ref: '#/components/schemas/LocalizedFlags'
        revision:
          type: string
          description: Opaque; changes whenever the rendered instructions document could change (instructions, latest version, public URL, names).
    Home:
      type: object
      additionalProperties: false
      required: [pinned, ranking, window_hours]
      properties:
        pinned:
          type: array
          items:
            $ref: '#/components/schemas/PublicApp'
        ranking:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/RankingEntry'
        window_hours:
          type: integer
          const: 168
    RankingEntry:
      type: object
      additionalProperties: false
      required: [app, download_clients]
      properties:
        app:
          $ref: '#/components/schemas/PublicApp'
        download_clients:
          type: integer
          format: int64
          minimum: 1
          description: Distinct clients with a complete download in the window (summed over hourly buckets).
    CatalogPage:
      type: object
      additionalProperties: false
      required: [items, page, limit, total, total_pages, categories]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicApp'
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
        total_pages:
          type: integer
          minimum: 1
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryCount'
    SearchResult:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/SearchHit'
    SearchHit:
      type: object
      additionalProperties: false
      required: [kind, key, name, icon, localized_icons]
      description: Navigate to `/{key}`.
      properties:
        kind:
          type: string
          enum: [vendor, app]
        key:
          type: string
          description: Vendor ID or application key.
        name:
          $ref: '#/components/schemas/LocalizedText'
        icon:
          $ref: '#/components/schemas/IconPath'
        localized_icons:
          description: Vendors only; `null` for applications.
          oneOf:
            - $ref: '#/components/schemas/LocalizedIcons'
            - type: 'null'
    HostedFile:
      type: object
      additionalProperties: false
      required: [id, path, sha256, size_bytes, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uid'
        path:
          type: string
          description: Application-relative path without leading `/`, for example `tools/setup.exe`.
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        created_at:
          type: string
          format: date-time
    HostedFilePage:
      type: object
      additionalProperties: false
      required: [items, page, limit, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HostedFile'
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
        total_pages:
          type: integer
          minimum: 1

    # ------------------------------------------------------------ auth
    LoginRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
    Session:
      type: object
      additionalProperties: false
      required: [csrf_token, expires_at]
      properties:
        csrf_token:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Send as `X-CSRF-Token` on unsafe admin requests. Keep in memory only.
        expires_at:
          type: string
          format: date-time
          description: Session end (8 hours after sign-in).
    PasswordChange:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 1
        new_password:
          type: string
          description: 12 to 72 bytes (UTF-8).
          minLength: 4
          maxLength: 72

    # ------------------------------------------------------------ overview
    MetricKey:
      type: string
      description: Metric key from the fixed catalog (see `docs/guide/metrics.md`).
      enum:
        - disk.used_bytes
        - disk.logical_bytes
        - disk.allocated_cache_bytes
        - disk.allocated_temporary_bytes
        - disk.allocated_pending_bytes
        - disk.cache_bytes
        - disk.temporary_bytes
        - disk.pending_bytes
        - disk.other_bytes
        - disk.free_bytes
        - counters.requests
        - counters.artifact_requests
        - counters.cache_hit_requests
        - counters.shared_follower_requests
        - counters.miss_requests
        - counters.download_success
        - counters.download_errors
        - counters.upstream_errors
        - counters.upstream_bytes
        - counters.downstream_bytes
        - counters.cleanup_freed_bytes
        - rates.upstream_bytes_per_second
        - rates.downstream_bytes_per_second
        - runtime.memory_bytes
        - runtime.goroutines
        - runtime.uptime_seconds
        - resources.total
        - resources.current
        - resources.retired
        - resources.readers
        - resources.active_writers
        - resources.queued
        - resources.downloading
        - resources.resuming
        - resources.retry_wait
        - resources.verifying
        - resources.complete
        - resources.failed
        - resources.invalid
        - resources.interrupted
        - versions.total
    Metric:
      type: object
      additionalProperties: false
      required: [key, label, kind, unit, group, value, observed_seconds]
      properties:
        key:
          $ref: '#/components/schemas/MetricKey'
        label:
          type: string
        kind:
          type: string
          enum: [gauge, counter, rate]
        unit:
          type: string
          enum: [bytes, bytes_per_second, count, seconds]
        group:
          type: string
          enum: [disk, traffic, speed, runtime, resources]
        value:
          type: [number, 'null']
          description: '`null` when unknown (rates in the first 5 seconds; `versions.total` of HTTP cache applications).'
        observed_seconds:
          type: number
          minimum: 0
          description: Observation window of a rate (5), otherwise 0.
    GlobalStatus:
      type: object
      additionalProperties: false
      required: [sampled_at, started_at, metrics]
      properties:
        sampled_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        metrics:
          type: array
          description: All 41 global metrics in catalog order.
          items:
            $ref: '#/components/schemas/Metric'
    AppStatus:
      type: object
      additionalProperties: false
      required: [sampled_at, metrics]
      properties:
        sampled_at:
          type: string
          format: date-time
        metrics:
          type: array
          description: The 25 application metrics in catalog order.
          items:
            $ref: '#/components/schemas/Metric'
    HistorySeries:
      type: object
      additionalProperties: false
      required: [key, label, kind, unit, group, scope, app_key, range, resolution_seconds, from, to, points]
      properties:
        key:
          $ref: '#/components/schemas/MetricKey'
        label:
          type: string
        kind:
          type: string
          enum: [gauge, counter, rate]
        unit:
          type: string
          enum: [bytes, bytes_per_second, count, seconds]
        group:
          type: string
          enum: [disk, traffic, speed, runtime, resources]
        scope:
          type: string
          enum: [global, app]
        app_key:
          description: "Application key for `scope: app`, otherwise `null`."
          oneOf:
            - $ref: '#/components/schemas/AppKey'
            - type: 'null'
        range:
          type: string
          enum: [24h, 7d, 30d]
        resolution_seconds:
          type: integer
          enum: [60, 3600]
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        points:
          type: array
          description: Only buckets that have data; gaps are missing points, never zeros.
          items:
            $ref: '#/components/schemas/HistoryPoint'
    HistoryPoint:
      type: object
      additionalProperties: false
      required: [time, value, min, max, avg, last, count, delta, delta_count, observed_seconds, partial, incomplete]
      properties:
        time:
          type: string
          format: date-time
          description: Bucket start (UTC).
        value:
          type: [number, 'null']
          description: Raw sample (24h) or representative value of the bucket.
        min:
          type: [number, 'null']
        max:
          type: [number, 'null']
        avg:
          type: [number, 'null']
          description: Gauges average; rates time-weighted average.
        last:
          type: [number, 'null']
        count:
          type: integer
          minimum: 0
          description: Samples in the bucket.
        delta:
          type: [number, 'null']
          description: Counters only; sum of known increases, `null` when unknown.
        delta_count:
          type: integer
          minimum: 0
        observed_seconds:
          type: number
          minimum: 0
        partial:
          type: boolean
          description: The bucket is still in progress.
        incomplete:
          type: boolean
          description: Fewer samples than expected.
    Event:
      type: object
      additionalProperties: false
      required: [id, time, category, code, message, status_code, app_key, version, resource_key, generation_id]
      properties:
        id:
          type: integer
          format: int64
        time:
          type: string
          format: date-time
        category:
          type: string
          description: Event family, for example `http`, `metadata`, `warning`, `cleanup`.
        code:
          type: string
          description: Stable machine code of the event.
        message:
          type: string
          description: English description; never contains credentials.
        status_code:
          type: [integer, 'null']
          minimum: 100
          maximum: 599
          description: Upstream HTTP status, when relevant.
        app_key:
          oneOf:
            - $ref: '#/components/schemas/AppKey'
            - type: 'null'
        version:
          type: [string, 'null']
        resource_key:
          type: [string, 'null']
        generation_id:
          type: [string, 'null']
    EventPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'

    # ------------------------------------------------------------ settings
    SiteSettings:
      type: object
      additionalProperties: false
      required: [title, subtitle, disclaimer]
      description: |
        Title 1..80 characters per language (required), subtitle up to 160, disclaimer up to 500.
        No control characters except newline and tab.
      properties:
        title:
          $ref: '#/components/schemas/LocalizedText'
        subtitle:
          $ref: '#/components/schemas/LocalizedText'
        disclaimer:
          $ref: '#/components/schemas/LocalizedText'
    SiteSettingsState:
      type: object
      additionalProperties: false
      required: [title, subtitle, disclaimer, revision]
      properties:
        title:
          $ref: '#/components/schemas/LocalizedText'
        subtitle:
          $ref: '#/components/schemas/LocalizedText'
        disclaimer:
          $ref: '#/components/schemas/LocalizedText'
        revision:
          $ref: '#/components/schemas/Revision'
    PublicUrlSettings:
      type: object
      additionalProperties: false
      required: [override_url]
      properties:
        override_url:
          type: [string, 'null']
          maxLength: 2048
          description: http(s) origin without credentials, path, query or fragment; `null` clears the override.
    PublicUrlState:
      type: object
      additionalProperties: false
      required: [override_url, environment_url, effective_url, source, revision]
      properties:
        override_url:
          type: [string, 'null']
        environment_url:
          type: [string, 'null']
          description: '`REDAPP_PUBLIC_URL`, if set.'
        effective_url:
          type: string
        source:
          type: string
          enum: [override, environment, request]
        revision:
          $ref: '#/components/schemas/Revision'
    GlobalProxySettings:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [direct, url]
        url:
          type: string
          maxLength: 4096
          description: "Required with and only allowed with `mode: url`."
      if:
        properties:
          mode:
            const: url
      then:
        required: [url]
      else:
        not:
          required: [url]
    GlobalProxyState:
      type: object
      additionalProperties: false
      required: [mode, dns, revision]
      properties:
        mode:
          type: string
          enum: [direct, url]
        url:
          type: string
          description: "Present with `mode: url`; password redacted as `****`."
        dns:
          type: string
          enum: [local, proxy]
        revision:
          $ref: '#/components/schemas/Revision'
    HomepageSettings:
      type: object
      additionalProperties: false
      required: [pinned_app_keys]
      properties:
        pinned_app_keys:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AppKey'
    HomepageSettingsState:
      type: object
      additionalProperties: false
      required: [pinned_app_keys, revision]
      properties:
        pinned_app_keys:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AppKey'
        revision:
          $ref: '#/components/schemas/Revision'

    # ------------------------------------------------------------ directory
    Provider:
      type: object
      additionalProperties: false
      required: [key, name, description, default_base_url, default_cache_ttl_seconds, capabilities]
      properties:
        key:
          $ref: '#/components/schemas/ProviderKey'
        name:
          $ref: '#/components/schemas/LocalizedText'
        description:
          $ref: '#/components/schemas/LocalizedText'
        default_base_url:
          type: [string, 'null']
          description: Default upstream for release providers, otherwise `null`.
        default_cache_ttl_seconds:
          type: [integer, 'null']
          description: Default `cache_ttl_seconds` (`null` for `info` and `hosted`).
        capabilities:
          $ref: '#/components/schemas/Capabilities'
    ProviderList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Provider'
    Vendor:
      type: object
      additionalProperties: false
      required: [uid, id, name, description, icon, localized_icons, enabled, has_template, revision, deleted_at]
      properties:
        uid:
          $ref: '#/components/schemas/Uid'
        id:
          $ref: '#/components/schemas/VendorId'
        name:
          $ref: '#/components/schemas/LocalizedText'
        description:
          $ref: '#/components/schemas/LocalizedText'
        icon:
          $ref: '#/components/schemas/IconPath'
        localized_icons:
          $ref: '#/components/schemas/LocalizedIcons'
        enabled:
          type: boolean
        has_template:
          type: boolean
          description: The vendor is built-in (linked to an embedded preset).
        revision:
          $ref: '#/components/schemas/Revision'
        deleted_at:
          type: [string, 'null']
          format: date-time
    VendorListItem:
      type: object
      additionalProperties: false
      required: [uid, id, name, description, icon, localized_icons, enabled, has_template, revision, deleted_at, apps, app_total]
      properties:
        uid:
          $ref: '#/components/schemas/Uid'
        id:
          $ref: '#/components/schemas/VendorId'
        name:
          $ref: '#/components/schemas/LocalizedText'
        description:
          $ref: '#/components/schemas/LocalizedText'
        icon:
          $ref: '#/components/schemas/IconPath'
        localized_icons:
          $ref: '#/components/schemas/LocalizedIcons'
        enabled:
          type: boolean
        has_template:
          type: boolean
        revision:
          $ref: '#/components/schemas/Revision'
        deleted_at:
          type: [string, 'null']
          format: date-time
        apps:
          type: array
          maxItems: 5
          description: First matching applications by key.
          items:
            $ref: '#/components/schemas/App'
        app_total:
          type: integer
          format: int64
          minimum: 0
          description: Number of matching applications of the vendor.
    VendorPage:
      type: object
      additionalProperties: false
      required: [items, page, limit, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VendorListItem'
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
        total_pages:
          type: integer
          minimum: 1
    VendorCreate:
      type: object
      additionalProperties: false
      required: [id, name, enabled]
      properties:
        id:
          $ref: '#/components/schemas/VendorId'
        name:
          $ref: '#/components/schemas/Name'
        description:
          $ref: '#/components/schemas/Description'
        icon:
          $ref: '#/components/schemas/IconPath'
        localized_icons:
          $ref: '#/components/schemas/LocalizedIcons'
        enabled:
          type: boolean
    Name:
      type: object
      additionalProperties: false
      required: [en, zh-CN]
      description: Both languages required, 1..256 bytes, not blank, no NUL.
      properties:
        en:
          type: string
          minLength: 1
          maxLength: 256
        zh-CN:
          type: string
          minLength: 1
          maxLength: 256
    Description:
      type: object
      additionalProperties: false
      required: [en, zh-CN]
      description: Up to 16384 bytes per language, no NUL.
      properties:
        en:
          type: string
          maxLength: 16384
        zh-CN:
          type: string
          maxLength: 16384
    App:
      type: object
      additionalProperties: false
      required: [uid, id, key, vendor_uid, vendor_id, name, description, icon, provider, categories, tags, enabled, builtin_template, source_epoch, revision, deleted_at]
      description: |
        Administrator view. Upstream fields depend on the provider: `base_url` (`codex`, `claude-code`),
        `base_urls` and `source_strategy` (`http-cache`), `cache_ttl_seconds` (all three); absent otherwise.
      properties:
        uid:
          $ref: '#/components/schemas/Uid'
        id:
          $ref: '#/components/schemas/Slug'
        key:
          $ref: '#/components/schemas/AppKey'
        vendor_uid:
          $ref: '#/components/schemas/Uid'
        vendor_id:
          $ref: '#/components/schemas/VendorId'
        name:
          $ref: '#/components/schemas/LocalizedText'
        description:
          $ref: '#/components/schemas/LocalizedText'
        icon:
          $ref: '#/components/schemas/IconPath'
        provider:
          $ref: '#/components/schemas/ProviderKey'
        base_url:
          type: string
        base_urls:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: string
        source_strategy:
          $ref: '#/components/schemas/SourceStrategy'
        cache_ttl_seconds:
          type: integer
          minimum: 0
          maximum: 86400
          description: Channel TTL for release providers (≥ 1); default freshness TTL for `http-cache`.
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Slug'
        tags:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        builtin_template:
          type: boolean
          description: Built-in (cannot be deleted).
        source_epoch:
          type: integer
          format: int64
          minimum: 0
          description: Current source epoch (`0` for providers without upstream).
        revision:
          $ref: '#/components/schemas/Revision'
        deleted_at:
          type: [string, 'null']
          format: date-time
    AppListItem:
      type: object
      additionalProperties: false
      required: [uid, id, key, vendor_uid, vendor_id, name, description, icon, provider, categories, tags, enabled, builtin_template, source_epoch, revision, deleted_at, latest_version, version_discovered_at, successful_downloads]
      properties:
        uid:
          $ref: '#/components/schemas/Uid'
        id:
          $ref: '#/components/schemas/Slug'
        key:
          $ref: '#/components/schemas/AppKey'
        vendor_uid:
          $ref: '#/components/schemas/Uid'
        vendor_id:
          $ref: '#/components/schemas/VendorId'
        name:
          $ref: '#/components/schemas/LocalizedText'
        description:
          $ref: '#/components/schemas/LocalizedText'
        icon:
          $ref: '#/components/schemas/IconPath'
        provider:
          $ref: '#/components/schemas/ProviderKey'
        base_url:
          type: string
        base_urls:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: string
        source_strategy:
          $ref: '#/components/schemas/SourceStrategy'
        cache_ttl_seconds:
          type: integer
          minimum: 0
          maximum: 86400
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Slug'
        tags:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        builtin_template:
          type: boolean
        source_epoch:
          type: integer
          format: int64
          minimum: 0
        revision:
          $ref: '#/components/schemas/Revision'
        deleted_at:
          type: [string, 'null']
          format: date-time
        latest_version:
          type: [string, 'null']
          description: Newest locally known version of the current source epoch.
        version_discovered_at:
          type: [string, 'null']
          format: date-time
        successful_downloads:
          type: [integer, 'null']
          format: int64
          description: Lifetime `counters.download_success`; `null` for `info` and `hosted`.
    AppPage:
      type: object
      additionalProperties: false
      required: [items, page, limit, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AppListItem'
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
        total_pages:
          type: integer
          minimum: 1
    AppCreate:
      type: object
      additionalProperties: false
      required: [vendor, id, provider, name, enabled]
      properties:
        vendor:
          $ref: '#/components/schemas/VendorId'
        id:
          $ref: '#/components/schemas/Slug'
        provider:
          $ref: '#/components/schemas/ProviderKey'
        name:
          $ref: '#/components/schemas/Name'
        description:
          $ref: '#/components/schemas/Description'
        icon:
          $ref: '#/components/schemas/IconPath'
        enabled:
          type: boolean
        categories:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/Slug'
        tags:
          $ref: '#/components/schemas/Tags'
        base_url:
          $ref: '#/components/schemas/HttpUrl'
        base_urls:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items:
            $ref: '#/components/schemas/HttpUrl'
        source_strategy:
          $ref: '#/components/schemas/SourceStrategy'
        cache_ttl_seconds:
          type: integer
          minimum: 0
          maximum: 86400
    Tags:
      type: array
      maxItems: 50
      description: Private search tags; trimmed, leading `#` removed, NFC, 1..64 characters, case-insensitive duplicates collapse.
      items:
        type: string
        minLength: 1
        maxLength: 64
    EntityStateUpdate:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
    AppDeletion:
      type: object
      additionalProperties: false
      required: [cleanup_pending]
      properties:
        cleanup_pending:
          type: boolean
          description: Some files could not be removed yet; they are removed later or at the next start.
    IconUpload:
      type: object
      additionalProperties: false
      required: [file]
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          description: One PNG, JPEG or SVG image, at most 2 MiB.
    StoredIcon:
      type: object
      additionalProperties: false
      required: [icon]
      properties:
        icon:
          $ref: '#/components/schemas/IconPath'

    # ------------------------------------------------------------ configuration
    FieldOrigin:
      type: object
      additionalProperties: false
      required: [source, differs_from_template]
      properties:
        source:
          type: string
          enum: [inherited, custom]
          description: '`inherited` follows the template; `custom` is an override (or any field without template).'
        differs_from_template:
          type: [boolean, 'null']
          description: '`null` without template.'
    VendorSpec:
      type: object
      additionalProperties: false
      required: [name, description, icon, localized_icons, proxy]
      properties:
        name:
          $ref: '#/components/schemas/LocalizedText'
        description:
          $ref: '#/components/schemas/LocalizedText'
        icon:
          $ref: '#/components/schemas/IconPath'
        localized_icons:
          $ref: '#/components/schemas/LocalizedIcons'
        proxy:
          $ref: '#/components/schemas/ProxyConfig'
    AppSpec:
      type: object
      additionalProperties: false
      required: [name, description, icon, provider, proxy, categories, tags, instructions]
      description: Provider-specific fields are present only where they apply (see `patchAppConfiguration`).
      properties:
        name:
          $ref: '#/components/schemas/LocalizedText'
        description:
          $ref: '#/components/schemas/LocalizedText'
        icon:
          $ref: '#/components/schemas/IconPath'
        provider:
          $ref: '#/components/schemas/ProviderKey'
        proxy:
          $ref: '#/components/schemas/ProxyConfig'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Slug'
        tags:
          type: array
          items:
            type: string
        instructions:
          $ref: '#/components/schemas/Instructions'
        base_url:
          type: string
        base_urls:
          type: array
          items:
            type: string
        source_strategy:
          $ref: '#/components/schemas/SourceStrategy'
        cache_ttl_seconds:
          type: integer
          minimum: 0
          maximum: 86400
        http_policy:
          $ref: '#/components/schemas/HttpPolicy'
        retention:
          $ref: '#/components/schemas/RetentionPolicy'
        prewarm:
          $ref: '#/components/schemas/PrewarmPolicy'
    Instructions:
      type: object
      additionalProperties: false
      required: [en, zh-CN]
      description: Markdown per language, at most 12000 characters, no control characters except newline, CR and tab. Empty stays empty (no fallback to the template).
      properties:
        en:
          type: string
          maxLength: 12000
        zh-CN:
          type: string
          maxLength: 12000
    HttpPolicy:
      type: object
      additionalProperties: false
      required: [stale_fallback, rules, auto_cleanup]
      properties:
        stale_fallback:
          type: boolean
          description: Serve an expired complete copy of the same source epoch when all sources fail (network, timeout, 5xx).
        rules:
          type: array
          maxItems: 32
          description: First matching rule sets the TTL and overrides upstream `no-store`/`private`.
          items:
            $ref: '#/components/schemas/CacheRule'
        auto_cleanup:
          type: array
          maxItems: 32
          description: First matching rule decides; empty disables automatic cleanup.
          items:
            $ref: '#/components/schemas/CleanupRule'
    CacheRule:
      type: object
      additionalProperties: false
      required: [match, ttl_seconds]
      properties:
        match:
          $ref: '#/components/schemas/PathMatch'
        ttl_seconds:
          type: integer
          minimum: 0
          maximum: 86400
    CleanupRule:
      type: object
      additionalProperties: false
      required: [match, basis, age_seconds]
      properties:
        match:
          $ref: '#/components/schemas/PathMatch'
        basis:
          $ref: '#/components/schemas/CleanupBasis'
        age_seconds:
          type: integer
          format: int64
          minimum: 60
          maximum: 315360000
    CleanupBasis:
      type: string
      enum: [fetched_at, last_access]
    RetentionPolicy:
      type: object
      additionalProperties: false
      required: [enabled, keep_latest]
      properties:
        enabled:
          type: boolean
        keep_latest:
          type: integer
          minimum: 1
          maximum: 1000
    PrewarmPolicy:
      type: object
      additionalProperties: false
      required: [enabled, channels, platforms]
      description: Automatic prewarm every 15 minutes of the versions the channels point to, for the platforms.
      properties:
        enabled:
          type: boolean
        channels:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [latest, stable]
        platforms:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PlatformId'
    PlatformId:
      type: string
      description: '`codex` supports the first 6, `claude-code` all 8.'
      enum: [darwin-arm64, darwin-x64, linux-arm64, linux-x64, win32-arm64, win32-x64, linux-arm64-musl, linux-x64-musl]
    VendorConfigurationPath:
      type: string
      enum: [name.en, name.zh-CN, description.en, description.zh-CN, icon, localized_icons.en, localized_icons.zh-CN, proxy]
    AppConfigurationPath:
      type: string
      enum:
        - name.en
        - name.zh-CN
        - description.en
        - description.zh-CN
        - icon
        - proxy
        - instructions.en
        - instructions.zh-CN
        - base_url
        - base_urls
        - source_strategy
        - cache_ttl_seconds
        - http_policy.rules
        - http_policy.auto_cleanup
        - http_policy.stale_fallback
        - retention
        - prewarm
        - categories
        - tags
    VendorConfiguration:
      type: object
      additionalProperties: false
      required: [revision, template_ref, template_hash, template_missing, defaults, overrides, effective, fields, proxy_effective]
      properties:
        revision:
          $ref: '#/components/schemas/Revision'
        template_ref:
          type: [string, 'null']
          description: Preset key (vendor ID) when linked to a template.
        template_hash:
          type: [string, 'null']
          description: Semantic hash of the template version.
        template_missing:
          type: boolean
          description: The referenced template no longer exists in this build.
        defaults:
          description: Template spec, `null` without template.
          oneOf:
            - $ref: '#/components/schemas/VendorSpec'
            - type: 'null'
        overrides:
          type: object
          description: Sparse nested object of overridden leaves (same shape as `VendorSpec`, only set leaves). `{}` without template.
        effective:
          $ref: '#/components/schemas/VendorSpec'
        fields:
          type: object
          description: Origin of every editable path.
          propertyNames:
            $ref: '#/components/schemas/VendorConfigurationPath'
          additionalProperties:
            $ref: '#/components/schemas/FieldOrigin'
        proxy_effective:
          $ref: '#/components/schemas/ProxyEffective'
    AppConfiguration:
      type: object
      additionalProperties: false
      required: [revision, template_ref, template_hash, template_missing, defaults, overrides, effective, fields, proxy_effective]
      properties:
        revision:
          $ref: '#/components/schemas/Revision'
        template_ref:
          type: [string, 'null']
          description: Preset key (`vendor/app`) when linked to a template.
        template_hash:
          type: [string, 'null']
        template_missing:
          type: boolean
        defaults:
          oneOf:
            - $ref: '#/components/schemas/AppSpec'
            - type: 'null'
        overrides:
          type: object
          description: Sparse nested object of overridden leaves (same shape as `AppSpec`). `{}` without template.
        effective:
          $ref: '#/components/schemas/AppSpec'
        fields:
          type: object
          propertyNames:
            $ref: '#/components/schemas/AppConfigurationPath'
          additionalProperties:
            $ref: '#/components/schemas/FieldOrigin'
        proxy_effective:
          $ref: '#/components/schemas/ProxyEffective'
    VendorConfigurationPatch:
      type: object
      additionalProperties: false
      properties:
        set:
          type: object
          additionalProperties: false
          properties:
            name.en:
              type: string
              minLength: 1
              maxLength: 256
            name.zh-CN:
              type: string
              minLength: 1
              maxLength: 256
            description.en:
              type: string
              maxLength: 16384
            description.zh-CN:
              type: string
              maxLength: 16384
            icon:
              $ref: '#/components/schemas/IconPath'
            localized_icons.en:
              $ref: '#/components/schemas/IconPath'
            localized_icons.zh-CN:
              $ref: '#/components/schemas/IconPath'
            proxy:
              $ref: '#/components/schemas/ProxyConfig'
        unset:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/VendorConfigurationPath'
    AppConfigurationPatch:
      type: object
      additionalProperties: false
      properties:
        set:
          type: object
          additionalProperties: false
          properties:
            name.en:
              type: string
              minLength: 1
              maxLength: 256
            name.zh-CN:
              type: string
              minLength: 1
              maxLength: 256
            description.en:
              type: string
              maxLength: 16384
            description.zh-CN:
              type: string
              maxLength: 16384
            icon:
              $ref: '#/components/schemas/IconPath'
            proxy:
              $ref: '#/components/schemas/ProxyConfig'
            instructions.en:
              type: string
              maxLength: 12000
            instructions.zh-CN:
              type: string
              maxLength: 12000
            base_url:
              $ref: '#/components/schemas/HttpUrl'
            base_urls:
              type: array
              minItems: 1
              maxItems: 16
              uniqueItems: true
              items:
                $ref: '#/components/schemas/HttpUrl'
            source_strategy:
              $ref: '#/components/schemas/SourceStrategy'
            cache_ttl_seconds:
              type: integer
              minimum: 0
              maximum: 86400
            http_policy.rules:
              type: array
              maxItems: 32
              items:
                $ref: '#/components/schemas/CacheRule'
            http_policy.auto_cleanup:
              type: array
              maxItems: 32
              items:
                $ref: '#/components/schemas/CleanupRule'
            http_policy.stale_fallback:
              type: boolean
            retention:
              $ref: '#/components/schemas/RetentionPolicy'
            prewarm:
              $ref: '#/components/schemas/PrewarmPolicy'
            categories:
              type: array
              maxItems: 32
              items:
                $ref: '#/components/schemas/Slug'
            tags:
              $ref: '#/components/schemas/Tags'
        unset:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AppConfigurationPath'
        new_categories:
          type: array
          maxItems: 32
          description: Category names (1..64 characters) to resolve or create and add to `set.categories`.
          items:
            type: string
            minLength: 1
            maxLength: 64
    AdminNotes:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          maxLength: 12000
          description: Private plain text; no control characters except newline, CR and tab. Never public.
    AdminNotesState:
      type: object
      additionalProperties: false
      required: [text, revision]
      properties:
        text:
          type: string
        revision:
          $ref: '#/components/schemas/Revision'
    Category:
      type: object
      additionalProperties: false
      required: [id, name, builtin, applications, revision, template_ref, template_hash, template_missing, defaults, overrides, effective, fields]
      properties:
        id:
          $ref: '#/components/schemas/Slug'
        name:
          $ref: '#/components/schemas/LocalizedText'
        builtin:
          type: boolean
        applications:
          type: integer
          format: int64
          minimum: 0
          description: Applications (any state) using the category.
        revision:
          $ref: '#/components/schemas/Revision'
        template_ref:
          type: [string, 'null']
        template_hash:
          type: [string, 'null']
        template_missing:
          type: boolean
        defaults:
          description: Template names for built-in categories, otherwise `null`.
          oneOf:
            - $ref: '#/components/schemas/CategorySpec'
            - type: 'null'
        overrides:
          type: object
          description: 'Sparse overridden leaves, for example `{"name": {"en": "..."}}`.'
        effective:
          $ref: '#/components/schemas/CategorySpec'
        fields:
          type: object
          propertyNames:
            type: string
            enum: [name.en, name.zh-CN]
          additionalProperties:
            $ref: '#/components/schemas/FieldOrigin'
    CategorySpec:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/LocalizedText'
    CategoryPage:
      type: object
      additionalProperties: false
      required: [items, page, limit, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
        total_pages:
          type: integer
          minimum: 1
    CategoryPatch:
      type: object
      additionalProperties: false
      properties:
        set:
          type: object
          additionalProperties: false
          properties:
            name.en:
              type: string
              minLength: 1
              maxLength: 256
            name.zh-CN:
              type: string
              minLength: 1
              maxLength: 256
        unset:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [name.en, name.zh-CN]

    # ------------------------------------------------------------ exchange
    ExportRequest:
      type: object
      additionalProperties: false
      required: [selection, mode, include_notes, include_proxy_credentials]
      properties:
        selection:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ExportSelection'
        mode:
          $ref: '#/components/schemas/ExchangeMode'
        include_notes:
          type: boolean
        include_proxy_credentials:
          type: boolean
    ExchangeMode:
      type: string
      enum: [linked, independent]
    ExportSelection:
      type: object
      additionalProperties: false
      required: [kind, key]
      properties:
        kind:
          type: string
          enum: [vendor, app]
        key:
          type: string
          description: Vendor ID or application key.
        include_apps:
          type: boolean
          description: Vendors only; also export all applications of the vendor.
    ImportUpload:
      type: object
      additionalProperties: false
      required: [file]
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          description: ZIP archive or one YAML document, at most 32 MiB.
        choices:
          type: string
          contentMediaType: application/json
          description: JSON array of `ImportChoice` (UTF-8, at most 1 MiB).
          x-json-schema:
            type: array
            items:
              $ref: '#/components/schemas/ImportChoice'
    ImportChoice:
      type: object
      additionalProperties: false
      required: [kind, key]
      description: |
        Decision for one package item (`kind` + `key` as in the preview). `target_vendor`/`target_id` rename the single
        application of a one-application package. `proxy` or `keep_effective_proxy` resolves `resolve_omitted_proxy` /
        `resolve_changed_proxy`; `detach_template` confirms `confirm_detach_template`; `update_notes` confirms
        `confirm_notes_update`; `dictionary_update` lets a category item update existing names.
      properties:
        kind:
          $ref: '#/components/schemas/ImportKind'
        key:
          type: string
        action:
          type: string
          enum: [create, update, skip]
        target_vendor:
          $ref: '#/components/schemas/VendorId'
        target_id:
          $ref: '#/components/schemas/Slug'
        dictionary_update:
          type: boolean
        proxy:
          $ref: '#/components/schemas/ProxyConfig'
        keep_effective_proxy:
          type: boolean
        detach_template:
          type: boolean
        update_notes:
          type: boolean
    ImportKind:
      type: string
      enum: [vendor, app, category]
    ImportPreview:
      type: object
      additionalProperties: false
      required: [id, digest, expires_at, ready, needs_instructions_trust, items]
      properties:
        id:
          $ref: '#/components/schemas/Uid'
        digest:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 of the uploaded package.
        expires_at:
          type: string
          format: date-time
        ready:
          type: boolean
          description: No item has unresolved `requirements`.
        needs_instructions_trust:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/ImportItem'
    ImportItem:
      type: object
      additionalProperties: false
      required: [kind, key, target, action, revision, notes_revision, template_hash_mismatch, template_missing, detach_template, omitted_fields, differences, requirements]
      properties:
        kind:
          $ref: '#/components/schemas/ImportKind'
        key:
          type: string
          description: Key in the package.
        target:
          type: string
          description: Key in this instance after renaming choices.
        action:
          type: string
          enum: [create, update, skip, keep]
          description: '`keep` is used for categories that exist with the same or kept names.'
        uid:
          description: UID of the existing target object.
          $ref: '#/components/schemas/Uid'
        revision:
          type: integer
          format: int64
          minimum: 0
          description: Revision of the existing target (`0` when created).
        notes_revision:
          type: integer
          format: int64
          minimum: 0
        template_hash_mismatch:
          type: boolean
        template_missing:
          type: boolean
        detach_template:
          type: boolean
        omitted_fields:
          type: array
          items:
            type: string
            examples: [proxy]
        differences:
          type: array
          items:
            $ref: '#/components/schemas/ImportDifference'
        requirements:
          type: array
          items:
            type: string
            enum: [confirm_detach_template, resolve_omitted_proxy, resolve_changed_proxy, confirm_notes_update]
    ImportDifference:
      type: object
      additionalProperties: false
      required: [field, before, after]
      properties:
        field:
          type: string
          description: Configuration path, `admin_notes` or `name` (categories). Proxy values are redacted.
        before:
          description: Current value (any JSON), `null` when absent.
        after:
          description: Imported value (any JSON), `null` when absent.
    ImportExecuteRequest:
      type: object
      additionalProperties: false
      required: [trust_instructions]
      properties:
        trust_instructions:
          type: boolean
    ImportResult:
      type: object
      additionalProperties: false
      required: [applied, items]
      properties:
        applied:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/ImportApplied'
    ImportApplied:
      type: object
      additionalProperties: false
      required: [kind, key, revision]
      properties:
        kind:
          $ref: '#/components/schemas/ImportKind'
        key:
          type: string
        uid:
          $ref: '#/components/schemas/Uid'
        revision:
          $ref: '#/components/schemas/Revision'
    CopyRequest:
      type: object
      additionalProperties: false
      required: [source_uid, target_vendor, target_id, mode, include_notes]
      properties:
        source_uid:
          $ref: '#/components/schemas/Uid'
        target_vendor:
          $ref: '#/components/schemas/VendorId'
        target_id:
          $ref: '#/components/schemas/Slug'
        mode:
          $ref: '#/components/schemas/ExchangeMode'
        include_notes:
          type: boolean
        notes_revision:
          type: integer
          format: int64
          minimum: 1
          description: Required with `include_notes`; revision of the source notes the user saw.

    # ------------------------------------------------------------ releases
    Version:
      type: object
      additionalProperties: false
      required: [version, first_seen, requests, downstream_bytes]
      properties:
        version:
          type: string
        first_seen:
          type: string
          format: date-time
        requests:
          type: integer
          format: int64
          minimum: 0
          description: Artifact requests for this version.
        downstream_bytes:
          type: integer
          format: int64
          minimum: 0
    VersionPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Version'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    Resource:
      type: object
      additionalProperties: false
      required: [id, version, key, state, current, retired, bytes, total_bytes, expected_bytes, sha256, readers, active_writer, recent_bps, average_bps, resumes, verification_ns, download_ns, started_at, finished_at, error]
      description: One generation (stored copy) of a release artifact.
      properties:
        id:
          type: string
          description: Generation ID.
        version:
          type: string
        key:
          type: string
          description: Version-relative artifact key, for example `linux-x64/claude`.
        state:
          type: string
          enum: [queued, downloading, resuming, retry_wait, verifying, complete, failed, invalid, interrupted]
        current:
          type: boolean
          description: The current generation of its artifact.
        retired:
          type: boolean
          description: Replaced or removed, waiting for deletion.
        bytes:
          type: integer
          format: int64
          minimum: 0
          description: Bytes stored so far.
        total_bytes:
          type: [integer, 'null']
          format: int64
          description: Upstream `Content-Length`, when known.
        expected_bytes:
          type: [integer, 'null']
          format: int64
          description: Size declared by verified metadata, when known.
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        readers:
          type: integer
          minimum: 0
        active_writer:
          type: boolean
        recent_bps:
          type: number
          minimum: 0
        average_bps:
          type: number
          minimum: 0
        resumes:
          type: integer
          minimum: 0
        verification_ns:
          type: integer
          format: int64
          minimum: 0
        download_ns:
          type: integer
          format: int64
          minimum: 0
        started_at:
          type: string
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
        error:
          type: [string, 'null']
          description: Failure category and message of the last attempt; never contains credentials.
    ResourcePage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    VersionCleanupRequest:
      type: object
      additionalProperties: false
      required: [minimum_version]
      properties:
        minimum_version:
          type: string
          minLength: 1
          maxLength: 128
          description: Canonical version; cached versions strictly lower are selected.
        source_epoch:
          type: integer
          format: int64
          minimum: 1
          description: Defaults to the current source epoch.
    CleanupSelection:
      type: object
      additionalProperties: false
      required: [generation_id, version, resource_key, bytes]
      properties:
        generation_id:
          type: string
        version:
          type: string
        resource_key:
          type: string
        bytes:
          type: integer
          format: int64
          minimum: 0
    VersionCleanupPreview:
      type: object
      additionalProperties: false
      required: [id, source_epoch, created_at, expires_at, executed_at, selected, logical_bytes, reclaimable_bytes, active_generations, unknown_versions]
      properties:
        id:
          $ref: '#/components/schemas/Uid'
        source_epoch:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        executed_at:
          type: [string, 'null']
          format: date-time
        selected:
          type: array
          items:
            $ref: '#/components/schemas/CleanupSelection'
        logical_bytes:
          type: integer
          format: int64
          minimum: 0
        reclaimable_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Disk blocks freed once no other generation shares the blob.
        active_generations:
          type: integer
          minimum: 0
          description: Selected generations currently being read or written (removed after their transfers).
        unknown_versions:
          type: array
          items:
            type: string
          description: Cached versions that cannot be compared and are kept.
    RetentionStatus:
      type: object
      additionalProperties: false
      required: [last_run, next_check_at]
      properties:
        last_run:
          oneOf:
            - $ref: '#/components/schemas/RetentionRun'
            - type: 'null'
        next_check_at:
          type: [string, 'null']
          format: date-time
          description: Next automatic pass, `null` while the scheduler is not running.
    RetentionRun:
      type: object
      additionalProperties: false
      required: [attempted_at, succeeded_at, outcome, reason, retired_versions, logical_bytes]
      properties:
        attempted_at:
          type: string
          format: date-time
        succeeded_at:
          type: [string, 'null']
          format: date-time
          description: Last successful run (may be older than `attempted_at`).
        outcome:
          type: string
          enum: [success, failure, skip]
        reason:
          type: [string, 'null']
          enum: [retention_execution_failed, policy_source_or_channel_changed, channel_unavailable, null]
        retired_versions:
          type: integer
          minimum: 0
        logical_bytes:
          type: integer
          format: int64
          minimum: 0
    RetentionPreview:
      type: object
      additionalProperties: false
      required: [id, created_at, expires_at, executed_at, selected_versions, logical_bytes, reclaimable_bytes, result]
      properties:
        id:
          $ref: '#/components/schemas/Uid'
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        executed_at:
          type: [string, 'null']
          format: date-time
        selected_versions:
          type: integer
          minimum: 0
          maximum: 100
        logical_bytes:
          type: integer
          format: int64
          minimum: 0
        reclaimable_bytes:
          type: integer
          format: int64
          minimum: 0
        result:
          description: Receipt after execution, otherwise `null`.
          oneOf:
            - $ref: '#/components/schemas/RetentionReceipt'
            - type: 'null'
    RetentionReceipt:
      type: object
      additionalProperties: false
      required: [retired_versions, logical_bytes, skipped, selection]
      properties:
        retired_versions:
          type: integer
          minimum: 0
        logical_bytes:
          type: integer
          format: int64
          minimum: 0
        skipped:
          type: object
          description: Version → reason it was kept at execution time.
          additionalProperties:
            type: string
        selection:
          type: array
          items:
            $ref: '#/components/schemas/CleanupSelection'
    RetentionVersion:
      type: object
      additionalProperties: false
      required: [version, reasons, bytes, selected]
      properties:
        version:
          type: string
        reasons:
          type: array
          items:
            type: string
            enum: [latest_n, channel, in_use, uncomparable, outside_latest_n, cycle_limit]
          description: Why the version is kept (`latest_n`, `channel`, `in_use`, `uncomparable`) or selected (`outside_latest_n`), or deferred to a later pass (`cycle_limit`).
        bytes:
          type: integer
          format: int64
          minimum: 0
        selected:
          type: boolean
    RetentionVersionPage:
      type: object
      additionalProperties: false
      required: [items, page, limit, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RetentionVersion'
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
        total_pages:
          type: integer
          minimum: 1

    # ------------------------------------------------------------ cache
    SourceEpoch:
      type: object
      additionalProperties: false
      required: [epoch, current, active, created_at]
      description: Upstream fields follow the provider rules of `App`.
      properties:
        epoch:
          type: integer
          format: int64
          minimum: 1
        base_url:
          type: string
        base_urls:
          type: array
          items:
            type: string
        source_strategy:
          $ref: '#/components/schemas/SourceStrategy'
        current:
          type: boolean
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
    SourceList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SourceEpoch'
    CacheEntry:
      type: object
      additionalProperties: false
      required: [generation_id, path, size_bytes, sha256, etag, source_url, fetched_at, validated_at, last_access_at, fresh_until]
      properties:
        generation_id:
          type: string
        path:
          type: string
          description: Decoded application-relative path starting with `/`.
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Storage integrity only, not a publisher signature.
        etag:
          type: [string, 'null']
          description: Upstream validator, or a generated `"sha256-<hex>"`.
        source_url:
          type: string
          description: Source the body was fetched from (no credentials).
        fetched_at:
          type: string
          format: date-time
        validated_at:
          type: string
          format: date-time
        last_access_at:
          type: [string, 'null']
          format: date-time
        fresh_until:
          type: string
          format: date-time
    CacheEntryPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CacheEntry'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    CacheRefreshRequest:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path:
          type: string
          minLength: 2
          maxLength: 4096
          description: Decoded application-relative file path starting with `/` (not `/` itself).
    CacheRefreshItem:
      type: object
      additionalProperties: false
      required: [path, generation_id, status, reason]
      properties:
        path:
          type: string
        generation_id:
          type: [string, 'null']
          description: Stored generation after the refresh.
        status:
          type: string
          enum: [refreshed, not_modified, stale_fallback, failed]
        reason:
          type: [string, 'null']
    CacheRefreshPreviewRequest:
      type: object
      additionalProperties: false
      required: [match]
      properties:
        match:
          $ref: '#/components/schemas/PathMatch'
    CacheCleanupPreviewRequest:
      type: object
      additionalProperties: false
      required: [basis, before]
      properties:
        match:
          description: 'Defaults to `{"type": "glob", "pattern": "/"}` (all files).'
          $ref: '#/components/schemas/PathMatch'
        basis:
          $ref: '#/components/schemas/CleanupBasis'
        before:
          type: string
          format: date-time
          description: Files whose basis time is before this instant are selected.
        source_epoch:
          type: integer
          format: int64
          minimum: 1
          description: Defaults to the current source epoch.
    MaintenancePreview:
      type: object
      additionalProperties: false
      required: [id, kind, state, source_epoch, match, basis, before, created_at, expires_at, scanned_files, selected_files, selected_bytes, active_files, completed_files, failed_files, result]
      description: Frozen file set for an HTTP cache cleanup or refresh, and its progress and result.
      properties:
        id:
          $ref: '#/components/schemas/Uid'
        kind:
          type: string
          enum: [cleanup, refresh]
        state:
          type: string
          enum: [building, ready, running, done, failed]
        source_epoch:
          type: integer
          format: int64
          minimum: 1
        match:
          $ref: '#/components/schemas/PathMatch'
        basis:
          description: Cleanup only.
          oneOf:
            - $ref: '#/components/schemas/CleanupBasis'
            - type: 'null'
        before:
          type: [string, 'null']
          format: date-time
          description: Cleanup only.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Execution deadline of a `ready` preview.
        scanned_files:
          type: integer
          minimum: 0
        selected_files:
          type: integer
          minimum: 0
        selected_bytes:
          type: integer
          format: int64
          minimum: 0
        active_files:
          type: integer
          minimum: 0
          description: Selected files currently in use.
        completed_files:
          type: integer
          minimum: 0
        failed_files:
          type: integer
          minimum: 0
        result:
          description: '`CacheCleanupResult` (cleanup) or `CacheRefreshSummary` (refresh) once available, otherwise `null`.'
          oneOf:
            - $ref: '#/components/schemas/CacheCleanupResult'
            - $ref: '#/components/schemas/CacheRefreshSummary'
            - type: 'null'
    CacheCleanupResult:
      type: object
      additionalProperties: false
      required: [kind, selected_files, retired_files, skipped_accessed, skipped_changed, retired_bytes]
      properties:
        kind:
          type: string
          const: cleanup
        selected_files:
          type: integer
          minimum: 0
        retired_files:
          type: integer
          minimum: 0
        skipped_accessed:
          type: integer
          minimum: 0
        skipped_changed:
          type: integer
          minimum: 0
        retired_bytes:
          type: integer
          format: int64
          minimum: 0
    CacheRefreshSummary:
      type: object
      additionalProperties: false
      required: [kind, selected_files, completed_files, refreshed, not_modified, stale_fallback, failed, skipped]
      properties:
        kind:
          type: string
          const: refresh
        selected_files:
          type: integer
          minimum: 0
        completed_files:
          type: integer
          minimum: 0
        refreshed:
          type: integer
          minimum: 0
        not_modified:
          type: integer
          minimum: 0
        stale_fallback:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0
    MaintenanceItem:
      type: object
      additionalProperties: false
      required: [ordinal, generation_id, path, size_bytes, result_status, error_code]
      properties:
        ordinal:
          type: integer
          format: int64
          minimum: 0
        generation_id:
          type: string
        path:
          type: string
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        result_status:
          type: string
          enum: [pending, retired, skipped_accessed, skipped_changed, refreshed, not_modified, stale_fallback, failed, skipped]
        error_code:
          type: [string, 'null']
    MaintenanceItemPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, total_files, total_bytes, state]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceItem'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
        total_files:
          type: integer
          minimum: 0
        total_bytes:
          type: integer
          format: int64
          minimum: 0
        state:
          type: string
          enum: [building, ready, running, done, failed]
    AutoCleanupStatus:
      type: object
      additionalProperties: false
      required: [running, interval_seconds, scan_limit_per_app, retire_limit_per_app, last_attempt_at, last_success_at, last_error_at, last_error, passes_total, failures_total, configured_apps, scanned_files, retired_files, skipped_accessed, skipped_changed, retired_bytes]
      properties:
        running:
          type: boolean
        interval_seconds:
          type: integer
          const: 900
        scan_limit_per_app:
          type: integer
          const: 1000
        retire_limit_per_app:
          type: integer
          const: 100
        last_attempt_at:
          type: [string, 'null']
          format: date-time
        last_success_at:
          type: [string, 'null']
          format: date-time
        last_error_at:
          type: [string, 'null']
          format: date-time
        last_error:
          type: [string, 'null']
          description: Sanitized message of the last failed pass.
        passes_total:
          type: integer
          format: int64
          minimum: 0
        failures_total:
          type: integer
          format: int64
          minimum: 0
        configured_apps:
          type: integer
          minimum: 0
          description: Applications processed in the last pass.
        scanned_files:
          type: integer
          minimum: 0
          description: Last pass.
        retired_files:
          type: integer
          minimum: 0
          description: Last pass.
        skipped_accessed:
          type: integer
          minimum: 0
        skipped_changed:
          type: integer
          minimum: 0
        retired_bytes:
          type: integer
          format: int64
          minimum: 0
    PathMatchTest:
      type: object
      additionalProperties: false
      required: [match, path]
      properties:
        match:
          $ref: '#/components/schemas/PathMatch'
        path:
          type: string
          minLength: 1
          maxLength: 4096
    PathMatchResult:
      type: object
      additionalProperties: false
      required: [matches, path]
      properties:
        matches:
          type: boolean
        path:
          type: string
          description: Canonical form of the tested path.

    # ------------------------------------------------------------ prewarm
    PrewarmLimits:
      type: object
      additionalProperties: false
      required: [max_files, max_depth, max_download_bytes, max_duration_seconds]
      properties:
        max_files:
          type: integer
          minimum: 1
          maximum: 100000
        max_depth:
          type: integer
          minimum: 0
          maximum: 32
          description: Directory listing depth (HTTP cache indexes).
        max_download_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 1099511627776
        max_duration_seconds:
          type: integer
          minimum: 1
          maximum: 86400
    Platform:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/PlatformId'
        name:
          type: string
    PrewarmOptions:
      type: object
      additionalProperties: false
      required: [kind, channels, platforms, default_limits]
      properties:
        kind:
          type: string
          enum: [release, http_cache]
        channels:
          type: array
          description: Release channels (empty for `http_cache`).
          items:
            type: string
        platforms:
          type: array
          description: Release platforms (empty for `http_cache`).
          items:
            $ref: '#/components/schemas/Platform'
        default_limits:
          $ref: '#/components/schemas/PrewarmLimits'
    PrewarmStartRequest:
      description: Use the variant that matches `PrewarmOptions.kind`.
      oneOf:
        - $ref: '#/components/schemas/ReleasePrewarmRequest'
        - $ref: '#/components/schemas/HttpCachePrewarmRequest'
    ReleasePrewarmRequest:
      type: object
      additionalProperties: false
      required: [request_id, target, platforms]
      properties:
        request_id:
          $ref: '#/components/schemas/Uid'
        target:
          type: string
          minLength: 1
          maxLength: 128
          description: A channel of the application or a canonical version.
        platforms:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PlatformId'
        limits:
          $ref: '#/components/schemas/PrewarmLimits'
    HttpCachePrewarmRequest:
      type: object
      additionalProperties: false
      required: [request_id]
      anyOf:
        - required: [paths]
        - required: [indexes]
        - required: [manifest]
        - required: [match]
      properties:
        request_id:
          $ref: '#/components/schemas/Uid'
        paths:
          type: array
          maxItems: 100000
          description: File paths starting with `/` (each at most 4096 bytes, no scheme).
          items:
            type: string
            maxLength: 4096
        indexes:
          type: array
          maxItems: 100000
          description: Directory paths whose listings are crawled (HTML, nginx autoindex JSON, Caddy browse JSON; each listing at most 2 MiB).
          items:
            type: string
            maxLength: 4096
        manifest:
          type: string
          maxLength: 2097152
          description: UTF-8 list of file paths, one per line (blank lines ignored); appended to `paths`.
        match:
          description: Only discovered files matching this pattern are prewarmed.
          $ref: '#/components/schemas/PathMatch'
        limits:
          $ref: '#/components/schemas/PrewarmLimits'
    PrewarmRetryRequest:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id:
          $ref: '#/components/schemas/Uid'
    PrewarmJob:
      type: object
      additionalProperties: false
      required: [id, state, reason, automatic, target, resolved_version, platforms, created_at, updated_at, completed, succeeded, bytes, ignored, limits]
      properties:
        id:
          $ref: '#/components/schemas/Uid'
        state:
          type: string
          enum: [running, completed, completed_with_errors, limited, cancelled, interrupted]
        reason:
          type: [string, 'null']
          enum: [unchanged_target, prewarm_failed, task_limit, cancelled_or_configuration_changed, interrupted_by_shutdown, interrupted_by_restart, null]
        automatic:
          type: boolean
        target:
          type: [string, 'null']
          description: Release jobs only.
        resolved_version:
          type: [string, 'null']
          description: Version the target resolved to (release jobs).
        platforms:
          type: array
          items:
            $ref: '#/components/schemas/PlatformId'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed:
          type: integer
          minimum: 0
          description: Planned files processed.
        succeeded:
          type: integer
          minimum: 0
        bytes:
          type: integer
          format: int64
          minimum: 0
          description: Bytes read from upstream so far.
        ignored:
          type: object
          description: Discovered entries ignored during planning, counted by reason.
          additionalProperties:
            type: integer
            minimum: 0
        limits:
          $ref: '#/components/schemas/PrewarmLimits'
    PrewarmItem:
      type: object
      additionalProperties: false
      required: [key, status, reason, bytes]
      properties:
        key:
          type: string
          description: Artifact key (release) or path (HTTP cache).
        status:
          type: string
          enum: [pending, downloaded, cached, not_modified, ttl_fallback, stale_fallback, not_cacheable, skipped, failed]
        reason:
          type: [string, 'null']
        bytes:
          type: integer
          format: int64
          minimum: 0
    PrewarmItemPage:
      type: object
      additionalProperties: false
      required: [items, page, limit, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PrewarmItem'
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
        total_pages:
          type: integer
          minimum: 1

    # ------------------------------------------------------------ hosted
    HostedUpload:
      type: object
      additionalProperties: false
      required: [path, file]
      description: Multipart parts in this order; `path` and `expected_id` (each at most 4096 bytes) precede `file`.
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 4096
          description: Application-relative path without leading `/`, for example `tools/setup.exe`.
        expected_id:
          type: string
          description: Current file ID when replacing; empty or absent when creating.
          pattern: '^([0-9a-f]{32})?$'
        file:
          type: string
          contentMediaType: application/octet-stream
          description: The file content (a part with a file name).
      x-multipart-order: [path, expected_id, file]
    HostedImportRequest:
      type: object
      additionalProperties: false
      required: [path, url]
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 4096
        url:
          type: string
          format: uri
          maxLength: 8192
          pattern: '^https?://'
          description: Absolute http(s) URL without credentials or fragment; the query is kept.
        expected_id:
          $ref: '#/components/schemas/Uid'
    HostedTransfer:
      type: object
      additionalProperties: false
      required: [id, path, bytes, total_bytes, state]
      properties:
        id:
          $ref: '#/components/schemas/Uid'
        path:
          type: string
        bytes:
          type: integer
          format: int64
          minimum: 0
        total_bytes:
          type: [integer, 'null']
          format: int64
          description: Known total size, otherwise `null`.
        state:
          type: string
          enum: [receiving, committing]
