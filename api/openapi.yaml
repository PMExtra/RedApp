          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: uploadHostedFile
      tags: [hosted]
      summary: Upload a file to a hosted application (create or replace).
      description: |
        Streaming multipart upload: the small fields `path` and optional `expected_id` must precede the single `file`
        part; the file is never buffered in memory. Creating requires that no file exists at `path`; replacing requires
        `expected_id` equal to the current file ID at `path` (`409 FILE_CONFLICT` otherwise). The new file gets a new ID.
        `transfer_id` is a client-generated ID used to poll progress and cancel while the upload streams.
      x-limits:
        file_bytes: '`max_artifact_bytes` of the deployment configuration (default 4 GiB)'
        metadata_field_bytes: 4096
      x-timeout: The request body may take up to 5 minutes of idle-free streaming; the default API read deadline does not apply.
      parameters:
        - $ref: '#/components/parameters/TransferIdQuery'
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HostedUpload'
            encoding:
              file:
                contentType: application/octet-stream
      x-error-codes: [APPLICATION_NOT_FOUND, CAPABILITY_UNSUPPORTED, VALIDATION_FAILED, FILE_CONFLICT, TRANSFER_ID_IN_USE, TRANSFER_CANCELLED, ARTIFACT_TOO_LARGE, TRANSFER_CAPACITY, ENTITY_DELETED, SOURCE_CHANGED]
      responses:
        '201':
          description: Stored file.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostedFile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
