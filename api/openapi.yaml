    parameters:
      - $ref: '#/components/parameters/Vendor'
      - $ref: '#/components/parameters/App'
    post:
      operationId: importHostedFile
      tags: [hosted]
      summary: Import a file once from an http(s) URL (create or replace).
      description: |
        Same create/replace rules as `uploadHostedFile`. The URL must not contain credentials or a fragment; its query
        (for example a signed download token) is sent but never stored or returned. At most 4 redirects are
        followed, never from HTTPS to HTTP, and credentials and cookies are dropped on redirect. Uses the application's
        effective outbound proxy. The request returns when the file is stored; poll progress with `transfer_id`.
      x-timeout: Up to 5 minutes of streaming without a 60 s idle gap.
      parameters:
        - $ref: '#/components/parameters/TransferIdQuery'
      security:
        - sessionCookie: []
          csrfToken: []
      x-max-body-bytes: 16384
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostedImportRequest'
            examples:
              create:
                value:
                  path: tools/setup.exe
                  url: https://downloads.example.com/setup.exe
      x-error-codes: [APPLICATION_NOT_FOUND, CAPABILITY_UNSUPPORTED, VALIDATION_FAILED, FILE_CONFLICT, TRANSFER_ID_IN_USE, TRANSFER_CANCELLED, ARTIFACT_TOO_LARGE, TRANSFER_CAPACITY, IMPORT_SOURCE_FAILED, ENTITY_DELETED, SOURCE_CHANGED]
      responses:
