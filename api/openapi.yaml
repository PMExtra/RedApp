          name.en: {source: inherited, differs_from_template: false}
          proxy: {source: custom, differs_from_template: true}
          cache_ttl_seconds: {source: custom, differs_from_template: true}
        proxy_effective: {mode: url, url: 'http://ops:****@proxy.example.internal:3128', source_scope: app, source_id: openai/codex, dns: proxy}
