      - $ref: '#/components/parameters/App'
    post:
      operationId: previewRetention
      tags: [releases]
      summary: Preview a manual retention run with the saved policy.
      description: |
        `If-Match` must equal the application revision, so the preview reflects the saved (not a draft) policy.
        Channels are verified first; if any channel cannot be verified nothing is selected (`502 CHANNELS_UNVERIFIED`).
