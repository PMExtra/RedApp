  # ---------------------------------------------------------------- distribution
  /{vendor}/{app}/install.sh:
    parameters:
      - $ref: '#/components/parameters/Vendor'
      - $ref: '#/components/parameters/App'
    get:
      operationId: getShellInstaller
      tags: [distribution]
      summary: Serve the patched POSIX shell installer of a release application.
      description: |
        Available for providers with the `installers` capability (`codex`, `claude-code`). The embedded official
        installer is rendered with the application URL (`<public_url>/<vendor>/<app>`) so that every download goes
        through RedApp. Counted in `counters.requests`, never in downloads or rankings.
      x-error-codes: [APPLICATION_NOT_FOUND, FILE_NOT_FOUND, INSTALLER_UNAVAILABLE]
      responses:
        '200':
          $ref: '#/components/responses/InstallerScript'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /{vendor}/{app}/install.ps1:
    parameters:
      - $ref: '#/components/parameters/Vendor'
      - $ref: '#/components/parameters/App'
    get:
      operationId: getPowerShellInstaller
      tags: [distribution]
      summary: Serve the patched PowerShell installer of a release application.
      description: Same rules as `getShellInstaller`.
      x-error-codes: [APPLICATION_NOT_FOUND, FILE_NOT_FOUND, INSTALLER_UNAVAILABLE]
      responses:
        '200':
          $ref: '#/components/responses/InstallerScript'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /{vendor}/{app}/{file_path}:
    parameters:
      - $ref: '#/components/parameters/Vendor'
      - $ref: '#/components/parameters/App'
      - name: file_path
        in: path
        required: true
        description: Application-relative file path (one or more segments). See `x-distribution-routes`.
        x-greedy: true
        schema:
          type: string
          minLength: 1
          maxLength: 4096
    get:
      operationId: getDistributionFile
      tags: [distribution]
      summary: Serve a file of a published application.
      description: |
        Resolution order for a published application:

        1. `hosted`: the hosted file at `file_path`.
        2. `http-cache`: the cached or fetched upstream file at `<source>/<file_path>`.
        3. Reviewed static assets of the application descriptor (licences, public keys), `text/plain`.
        4. `codex` / `claude-code`: the release protocol routes in `x-distribution-routes`.

        Query strings are rejected (`400 INVALID_PATH` for `http-cache` and `hosted`, `400 INVALID_QUERY` otherwise).
        Every file request increments `counters.requests`. Complete GET downloads (`200`/`206`, full body written,
        client not cancelled) of artifacts, HTTP cache files and hosted files record one ranking hit for the client
        IP (IPv4 address or IPv6 /64). File responses override the default `Cache-Control` as documented per route.
      x-distribution-routes:
        - provider: codex
          path: channels/latest
          content_type: application/json
          description: Latest `release.json`, verified (every asset needs a `sha256:` digest) and rewritten to RedApp URLs. Channel TTL from `cache_ttl_seconds`.
        - provider: codex
          path: releases/{version}/release.json
          content_type: application/json
          description: Verified release metadata of one version.
        - provider: codex
          path: releases/{version}/{asset}
          content_type: application/octet-stream
          description: Release artifact. `X-Expected-SHA256` carries the verified digest.
        - provider: claude-code
          path: latest | stable
          content_type: text/plain; charset=utf-8
          description: Channel version followed by a newline.
        - provider: claude-code
          path: '{version}/manifest.json'
          content_type: application/json
          description: Signed manifest, original bytes.
        - provider: claude-code
          path: '{version}/manifest.json.sig'
          content_type: application/pgp-signature
          description: Detached OpenPGP signature, original bytes.
        - provider: claude-code
          path: '{version}/{platform}/{binary}'
          content_type: application/octet-stream
          description: Release artifact for one of 8 platforms. `X-Expected-SHA256` carries the digest from the signed manifest.
        - provider: codex, claude-code
          path: descriptor assets (`licenses/LICENSE`, `licenses/NOTICE`, `LICENSE.md`, `claude-code.asc`)
          content_type: text/plain; charset=utf-8
          description: "Embedded reviewed files, `Content-Security-Policy: sandbox; default-src 'none'`."
        - provider: http-cache
          path: '{path}'
          content_type: upstream value
          description: |
            `Content-Disposition: attachment`, `Content-Security-Policy: sandbox; default-src 'none'`.
            Conditional requests and a single byte range are served from the complete cached file
            (a cold range request first downloads the whole file; multiple ranges return the full file).
            `Cache-Control: only-if-cached` on a miss returns `504 CACHE_MISS`; other request cache directives are ignored.
            Uncacheable upstream responses (`no-store`/`private` without a matching rule, `Set-Cookie`, `Vary`
            other than `Accept-Encoding`) are streamed without storing.
        - provider: hosted
          path: '{path}'
          content_type: application/octet-stream
          description: |
            `Content-Disposition: attachment; filename=<base name>`, `ETag: "sha256-<hex>"`, `Cache-Control: no-cache`,
            `Content-Security-Policy: sandbox; default-src 'none'`. Conditional requests and single byte ranges.
      x-range-support: "hosted and http-cache support a single byte range; release artifacts and metadata do not (`Accept-Ranges: none`)."
      x-streaming: |
        Release artifacts are streamed while the shared upstream download progresses (many readers follow one writer).
        Upstream reads have a 60 s idle timeout and no total limit; a failed transfer is aborted mid-body
        (the connection is reset), never truncated silently. Reverse proxies must disable buffering.
      x-error-codes:
        - APPLICATION_NOT_FOUND
        - FILE_NOT_FOUND
        - ARTIFACT_TOO_LARGE
        - SOURCE_CHANGED
        - UPSTREAM_UNAVAILABLE
        - METADATA_UNTRUSTED
        - TRANSFER_CAPACITY
        - CACHE_CONTENDED
        - CACHE_MISS
      responses:
        '200':
          $ref: '#/components/responses/DistributionFile'
        '206':
          $ref: '#/components/responses/PartialContent'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: '`If-Match` or `If-Unmodified-Since` precondition of a file request failed (hosted, http-cache). No body.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '416':
          description: Requested range not satisfiable (hosted, http-cache). No body.
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
    head:
      operationId: headDistributionFile
      tags: [distribution]
      summary: Read the headers of a distribution file.
      description: |
        Same resolution as GET. For an uncached `http-cache` file RedApp sends `HEAD` upstream and stores nothing.
        HEAD never starts a release artifact download and never counts as a download.
      x-error-codes: [APPLICATION_NOT_FOUND, FILE_NOT_FOUND, SOURCE_CHANGED, UPSTREAM_UNAVAILABLE, METADATA_UNTRUSTED, TRANSFER_CAPACITY]
      responses:
        '200':
          description: Headers only.
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          description: Bad request (no body).
        '404':
          description: Not found (no body).
        '409':
          description: Source changed (no body).
        '500':
          description: Internal error (no body).
        '502':
          description: Upstream failure (no body).
        '503':
          description: Capacity or storage unavailable (no body).

  # ---------------------------------------------------------------- auth
  /admin/api/session:
    post:
      operationId: createSession
      tags: [auth]
      summary: Sign in with the administrator password.
      description: |
        Sets the `redapp_session` cookie and returns the CSRF token for this session.
        Rate limits: 10 attempts per client (IPv4 address or IPv6 /64) per 5 minutes, cleared by a successful
        sign-in; plus a global bucket of 20 password checks refilled at 1 per second. At most 128 concurrent sessions.
        No session or CSRF token is required. The `Origin` check applies.
      security: []
      x-max-body-bytes: 8192
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      x-error-codes: [LOGIN_FAILED, LOGIN_RATE_LIMITED, SESSION_LIMIT_EXCEEDED]
      responses:
        '201':
          description: Signed in.
          headers:
            Set-Cookie:
              description: '`redapp_session=<token>; Path=/admin; HttpOnly; SameSite=Strict; Max-Age=28800[; Secure]`'
              schema:
                type: string
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      operationId: getSession
      tags: [auth]
      summary: Read the current session and its CSRF token.
      description: Called when the admin SPA starts and when the tab becomes visible.
      security:
        - sessionCookie: []
      x-error-codes: []
      responses:
        '200':
          description: The current session.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteSession
      tags: [auth]
      summary: Sign out.
      description: Deletes the server-side session and expires the cookie.
      security:
        - sessionCookie: []
          csrfToken: []
      x-error-codes: []
      responses:
        '204':
          description: Signed out.
          headers:
            Set-Cookie:
              description: Expired `redapp_session` cookie.
              schema:
                type: string
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/api/password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the administrator password.
      description: |
        Verifies the current password (bcrypt) and stores the new one. On success every session is revoked,
        including the caller's; the response expires the cookie and the client must sign in again.
        Wrong current passwords count against the sign-in rate limit of the client.
      security:
        - sessionCookie: []
