      - $ref: '#/components/parameters/App'
      - $ref: '#/components/parameters/PreviewId'
    post:
      operationId: executeRetention
      tags: [releases]
      summary: Execute a retention preview.
      description: |
        Re-checks policy, source and channels; if any changed, nothing is deleted (`409 PREVIEW_STALE`).
        Versions that became protected meanwhile are skipped and reported in `skipped`. The outcome is recorded in
        the retention status. Executing an executed preview returns its receipt.
      x-idempotency: The preview ID is the idempotency key; receipts are kept for 24 hours.
      security:
