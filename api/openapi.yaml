        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/DirectoryStateQuery'
        - name: sort
          in: query
          description: Sort key.
          schema:
            type: string
            enum: [name, version, updated, downloads]
            default: name
        - name: order
          in: query
          description: Sort direction.
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: lang
          in: query
          description: Name language used by `sort=name` (default `en`).
          schema:
            $ref: '#/components/schemas/Language'
        - $ref: '#/components/parameters/Page'
        - name: limit
