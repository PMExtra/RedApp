      summary: Create a custom application under an existing vendor.
      description: |
        The provider, vendor and ID are fixed after creation. Provider-specific fields:
        `codex`/`claude-code` accept `base_url` (default: provider default) and `cache_ttl_seconds` (channel TTL 1..86400, default 60);
        `http-cache` requires `base_urls` (1..16) and accepts `source_strategy` and `cache_ttl_seconds` (0..86400, default 300);
        `info`/`hosted` accept none of them. Proxy starts as `inherit`. Release applications get the
        default retention (`enabled: false, keep_latest: 3`) and prewarm (`enabled: false`) settings.
      security:
        - sessionCookie: []
          csrfToken: []
      x-max-body-bytes: 65536
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppCreate'
            examples:
              httpCache:
                value:
                  vendor: example
                  id: tools
                  provider: http-cache
                  name: {en: Tools, zh-CN: 工具}
                  description: {en: Internal tool mirror, zh-CN: 内部工具镜像}
                  icon: ''
                  enabled: false
                  categories: []
                  tags: [mirror]
                  base_urls: [https://files.example.internal/tools, https://mirror.example.internal/tools]
                  source_strategy: ordered
                  cache_ttl_seconds: 300
      x-error-codes: [VENDOR_NOT_FOUND, VALIDATION_FAILED, ALREADY_EXISTS, ENTITY_DELETED]
      responses:
