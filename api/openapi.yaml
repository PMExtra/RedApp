      x-error-codes: [CURRENT_PASSWORD_INCORRECT, PASSWORD_INVALID, LOGIN_RATE_LIMITED]
      responses:
        '204':
          description: Password changed; all sessions revoked.
          headers:
            Set-Cookie:
              description: Expired `redapp_session` cookie.
              schema:
                type: string
            X-Request-Id:
