openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: RedApp HTTP API
  version: unreleased
  summary: Public catalog, distribution paths and administration API of RedApp.
  license:
    name: MIT
    identifier: MIT
  description: |
    This document is the single source of truth for every HTTP route RedApp serves.
    The Go server (`internal/httpserver`) and the Vue frontend are implemented from it;
    contract tests validate real responses against it. Design notes are in `docs/dev/api.md`.

    ## Route families

    | Prefix | Audience | Format |
    | --- | --- | --- |
    | `/api/` | anonymous public API | JSON (one HTML document) |
    | `/admin/api/` | administrator API, session + CSRF | JSON (ZIP export, multipart uploads) |
    | `/<vendor>/<app>/<file_path>` | distribution: installers, release metadata, artifacts, hosted and HTTP cache files | binary/text |
    | `/`, `/all`, `/<vendor>`, `/<vendor>/<app>`, `/admin/...` | SPA pages | HTML |
    | `/assets/` | frontend build output, uploaded icons, preset images | static |
    | `/health/` | probes | JSON |

    ## Common rules

    - **Methods.** GET reads and is safe to retry; PUT replaces a whole settings document;
      PATCH applies a sparse change; POST creates or runs an action; DELETE removes.
      Every route registered for GET also answers HEAD (Go `http.ServeMux` semantics) with the same
      headers and no body; HEAD is listed explicitly only where it matters (files, icons).
    - **Path parameters** never contain `/` unless the parameter is marked `x-greedy: true`;
      greedy parameters take the rest of the path. Paths are canonical: `.`/`..` segments, `//`,
      backslashes, NUL and encoded `/` (`%2F`) or `\` (`%5C`) are rejected with `400 INVALID_PATH`.
    - **Query parameters** are allow-listed per operation. Unknown, repeated or empty parameters
      return `400 INVALID_QUERY`.
    - **JSON request bodies** require `Content-Type: application/json` (`415 UNSUPPORTED_MEDIA_TYPE`),
      are limited per operation (`x-max-body-bytes`, `413 PAYLOAD_TOO_LARGE`) and are rejected with
      `400 INVALID_REQUEST` on invalid UTF-8, duplicate keys, nesting deeper than 64, unknown fields,
      `null` where not declared nullable, wrong types or trailing data.
    - **JSON responses** use `snake_case` field names, RFC 3339 UTC timestamps and integer byte counts.
      Absent optional values are `null` when the schema says `nullable`; empty lists are `[]`, never `null`.
    - **Request IDs.** Every response carries `X-Request-Id` (16 lowercase hex characters) generated at the
      entry middleware. Error bodies repeat it as `error.request_id`; server logs use the same value.
    - **Security headers** on every response: `X-Content-Type-Options: nosniff`, `Referrer-Policy: same-origin`,
      `X-Frame-Options: DENY` (the instructions document uses `SAMEORIGIN`) and `Cache-Control: no-store`
      unless an operation documents another value.

    ## Errors

    Every non-2xx response, including router-level 404/405, uses the `Error` schema:
    `{"error": {"code", "message", "request_id", "retryable"}}`. Clients branch on `code` only.
    `message` is a human-readable English sentence without internal paths, SQL or upstream credentials.
    The complete catalog with HTTP status and `retryable` value is `components.x-error-codes`.

    Each operation lists its own codes in `x-error-codes`. In addition, every operation may return the codes
    of each group in `components.x-error-code-groups` whose `applies_when` condition holds
    (for example all admin operations may return `AUTH_REQUIRED`). Contract tests assert that a returned
    code is in this union and that its status matches the catalog.

    ## Revisions and conditional writes

    Every editable administrator resource has an integer `revision` (≥ 1) that increases on each change.
    GET returns it in the body and as `ETag: "<revision>"` (a quoted decimal string).
    Every write to such a resource (PUT, PATCH, DELETE and actions that depend on its configuration)
    requires `If-Match: "<revision>"`:
    missing or malformed → `400 IF_MATCH_REQUIRED`; stale → `409 REVISION_CONFLICT` (keep the draft, reload).
    `If-Match: *` and weak validators are not accepted. A successful write returns the complete new state
    with the new `revision` and `ETag`. Request bodies never contain `revision`.

    ## Pagination

    - **Page style** (bounded lists that need page navigation): `?page=&limit=`; response `PageMeta` fields
      `items`, `page`, `limit`, `total`, `total_pages` (≥ 1). Filters apply before paging. A page beyond
      `total_pages` returns `200` with empty `items` and the requested `page`.
    - **Cursor style** (time ordered or unbounded lists): `?limit=&cursor=`; response `items` and
      `next_cursor` (`null` on the last page). Cursors are opaque (≤ 2048 characters), bound to the endpoint,
      application, source epoch and filters; a cursor used elsewhere returns `400 INVALID_CURSOR`.
    - `limit` is always 1..100; defaults are documented per operation.

    ## Authentication

    Administrators sign in with `POST /admin/api/session`, which sets the `redapp_session` cookie
    (`HttpOnly`, `SameSite=Strict`, `Path=/admin`, `Secure` when the request origin is HTTPS, 8 hour lifetime,
    not extended by activity) and returns a CSRF token. Every `/admin/api/` request except sign-in needs the
    cookie. Every unsafe method (POST, PUT, PATCH, DELETE) except sign-in also needs `X-CSRF-Token`.
    Every `/admin/api/` request whose `Origin` header is present and differs from the request origin is rejected
    with `403 ORIGIN_REJECTED`. The request origin is derived from TLS, `Host` and the forwarding headers of
    trusted proxies; malformed trusted forwarding headers or an invalid `Host` return `400 REQUEST_ORIGIN_INVALID`
    on every route.
servers:
  - url: /
    description: Same origin as the SPA.
tags:
  - name: health
    description: Liveness and readiness probes.
  - name: public
    description: Anonymous catalog API.
  - name: pages
    description: SPA documents and redirects.
  - name: assets
    description: Frontend build output, uploaded icons and preset images.
  - name: distribution
    description: Installers, release metadata, artifacts, hosted and HTTP cache files.
  - name: auth
    description: Administrator session and password.
  - name: overview
    description: Status, metric history and events.
  - name: settings
    description: Global settings documents.
  - name: directory
    description: Providers, vendors, applications and icons.
  - name: configuration
    description: Template overlays, private notes and categories.
  - name: exchange
    description: Configuration export, import and application copy.
  - name: releases
    description: Versions, resources, version cleanup and retention of release applications (Codex, Claude Code).
  - name: cache
    description: Source epochs, HTTP cache entries, refresh and cleanup.
  - name: prewarm
    description: One-time prewarm tasks.
  - name: hosted
    description: Hosted file management.
x-spa-routes:
  description: |
    Paths that return the SPA document (`200 text/html`). Any other `/admin/...` path returns the SPA
    document with status 404. Vendor and application segments must exist (not necessarily enabled) for
    admin routes; public `/<vendor>` and `/<vendor>/<app>` routes require the vendor and application to be
    published, otherwise they return `index.html` with status 404 so that the SPA shows its not-found page.
    Tab availability follows provider capabilities: `files` only for `hosted`; `cache` for
    `http-cache`, `codex`, `claude-code`; `versions` for `codex`, `claude-code`.
    The frontend has two entries so that public visitors never download administrator code:
    public routes (`/`, `/all`, `/{vendor}`, `/{vendor}/{app}`) serve `index.html`, and every `/admin/...`
    page (including the 404 document) serves `admin.html`. Both files are read from the embedded build
    output root; `/admin/{ui_path}` must never fall back to `index.html`.
  documents:
    public: index.html
    admin: admin.html
  allowed_query: [returnTo, q, state, page, category, cleanup]
  routes:
    - /
    - /all
    - /{vendor}
    - /{vendor}/{app}
    - /admin/login
    - /admin/overview
    - /admin/events
    - /admin/settings/site
    - /admin/settings/proxy
    - /admin/vendors
    - /admin/vendors/new
    - /admin/categories
    - /admin/vendors/{vendor}
    - /admin/vendors/{vendor}/settings
    - /admin/vendors/{vendor}/apps
    - /admin/vendors/{vendor}/apps/new
    - /admin/vendors/{vendor}/admin-notes
    - /admin/vendors/{vendor}/apps/{app}/settings
    - /admin/vendors/{vendor}/apps/{app}/admin-notes
    - /admin/vendors/{vendor}/apps/{app}/versions
    - /admin/vendors/{vendor}/apps/{app}/cache
    - /admin/vendors/{vendor}/apps/{app}/files

paths:
  # ---------------------------------------------------------------- health
  /health/live:
    get:
      operationId: getLiveness
      tags: [health]
      summary: Report that the process answers HTTP.
      description: Never contacts upstreams or storage. Not counted in metrics.
      x-error-codes: []
      responses:
        '200':
          $ref: '#/components/responses/HealthOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /health/ready:
    get:
      operationId: getReadiness
      tags: [health]
      summary: Report that the database answers and the data directory is writable.
      description: |
        Pings SQLite and creates then removes a temporary file in the data directory.
        Never contacts upstreams. Not counted in metrics. Used by `redapp healthcheck`.
      x-error-codes: [NOT_READY]
      responses:
        '200':
          $ref: '#/components/responses/HealthOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  # ---------------------------------------------------------------- public API
  /api/bootstrap:
    get:
      operationId: getBootstrap
      tags: [public]
      summary: Read site texts, build information and the effective public URL.
      description: |
        Loaded once per page load and when the tab becomes visible. Contains no application data;
        public pages read applications with `getPublicApp`, `listCatalog` and `getHome`.
      x-error-codes: []
      responses:
        '200':
          description: Site bootstrap data.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bootstrap'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/home:
    get:
      operationId: getHome
      tags: [public]
      summary: Read pinned applications and the 7-day download ranking.
      description: |
        `pinned` follows the homepage settings order and skips unpublished applications.
        `ranking` has at most 20 entries ordered by distinct downloading clients over the last 168 hours
        (one-hour buckets); only complete `200`/`206` GET downloads of files count.
      x-error-codes: []
      responses:
        '200':
          description: Homepage data.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Home'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/catalog:
    get:
      operationId: listCatalog
      tags: [public]
      summary: List published applications with search, vendor and category filters.
      description: |
        Ordered by vendor ID then application ID. `q` matches application ID, `vendor/app` key,
        both localized names and private tags (case-insensitive substring; tags never appear in responses).
        `categories` counts published applications per category across the whole site, independent of filters.
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - name: vendor
          in: query
          description: Restrict to one published vendor.
          schema:
            $ref: '#/components/schemas/VendorId'
        - name: category
          in: query
          description: Restrict to one category ID.
          schema:
            $ref: '#/components/schemas/Slug'
        - $ref: '#/components/parameters/Page'
        - name: limit
          in: query
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 24
      x-error-codes: [VENDOR_NOT_FOUND]
      responses:
        '200':
          description: One catalog page.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/search:
    get:
      operationId: searchCatalog
      tags: [public]
      summary: Quick search over published vendors and applications.
      description: |
        Returns at most 4 vendors (ID or name match, ordered by ID) followed by at most 6 applications
        (same matching as `listCatalog`). An empty `q` returns no items.
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
      x-error-codes: []
      responses:
        '200':
          description: Search hits.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/vendors/{vendor}:
    parameters:
      - $ref: '#/components/parameters/Vendor'
    get:
      operationId: getPublicVendor
      tags: [public]
      summary: Read a published vendor.
      description: A vendor is published when it is enabled and not deleted.
      x-error-codes: [VENDOR_NOT_FOUND]
      responses:
        '200':
          description: The vendor.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicVendor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/apps/{vendor}/{app}:
    parameters:
      - $ref: '#/components/parameters/Vendor'
      - $ref: '#/components/parameters/App'
    get:
      operationId: getPublicApp
      tags: [public]
      summary: Read a published application.
      description: An application is published when it and its vendor are enabled and not deleted.
      x-error-codes: [APPLICATION_NOT_FOUND]
      responses:
        '200':
          description: The application.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApp'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/apps/{vendor}/{app}/files:
    parameters:
      - $ref: '#/components/parameters/Vendor'
      - $ref: '#/components/parameters/App'
    get:
      operationId: listPublicHostedFiles
      tags: [public]
      summary: List the files of a published hosted application.
      description: Ordered by path. Download each file at `/{vendor}/{app}/{path}` (encode each path segment).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit25'
      x-error-codes: [APPLICATION_NOT_FOUND, CAPABILITY_UNSUPPORTED]
      responses:
        '200':
          description: One page of hosted files.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostedFilePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/apps/{vendor}/{app}/instructions/document:
    parameters:
      - $ref: '#/components/parameters/Vendor'
      - $ref: '#/components/parameters/App'
    get:
      operationId: getInstructionsDocument
      tags: [public]
      summary: Render the usage instructions of a published application as a sandboxed HTML document.
      description: |
        Markdown (GFM, raw HTML allowed) rendered to a complete HTML document for an `<iframe>`.
        Template variables are substituted after rendering with HTML-escaped values:
        `{{base_url}}` and `{{public_origin}}` (effective public URL without trailing `/`), `{{app_path}}`
        (`/vendor/app`), `{{app_key}}`, `{{app_url}}`, `{{app_name}}` (in `lang`), `{{latest_version}}`
        (newest locally known version of the current source epoch, or `<version>`). Unknown variables stay literal.
        Code blocks get copy buttons. An empty instructions text renders an empty body.
      x-sandbox: |
        The response sets `Content-Security-Policy: sandbox allow-scripts allow-popups
        allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation; default-src * data: blob:;
        script-src * 'unsafe-inline' 'unsafe-eval' data: blob:; style-src * 'unsafe-inline'; frame-ancestors 'self'`
        and `X-Frame-Options: SAMEORIGIN`, so the document always has an opaque origin and cannot use the
        administrator session. The embedding iframe must carry the same sandbox flags and may add
        `allow="clipboard-write"`. The document posts `{"type": "redapp-instructions-height", "height": <px>}`
        to `window.parent` whenever its height changes; the parent clamps the height to 120..50000 px.
        Re-create the iframe when `PublicApp.revision` changes.
      parameters:
        - name: lang
          in: query
          required: true
          description: Instructions language.
          schema:
            $ref: '#/components/schemas/Language'
      x-error-codes: [APPLICATION_NOT_FOUND]
      responses:
        '200':
          description: HTML document.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Content-Security-Policy:
              description: Sandbox policy, see `x-sandbox`.
              schema:
                type: string
            X-Frame-Options:
              description: Always `SAMEORIGIN`.
              schema:
                type: string
                const: SAMEORIGIN
          content:
            text/html:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  # ---------------------------------------------------------------- pages
  /:
    get:
      operationId: getHomePage
      tags: [pages]
      summary: Serve the SPA document for the public home page.
      x-error-codes: []
      responses:
        '200':
          $ref: '#/components/responses/SpaDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /all:
    get:
      operationId: getCatalogPage
      tags: [pages]
      summary: Serve the SPA document for the full catalog.
      parameters:
        - $ref: '#/components/parameters/SpaQuery'
        - $ref: '#/components/parameters/SpaCategory'
        - $ref: '#/components/parameters/SpaPage'
      x-error-codes: []
      responses:
        '200':
          $ref: '#/components/responses/SpaDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin:
    get:
      operationId: redirectAdmin
      tags: [pages]
      summary: Redirect to the admin overview.
      x-error-codes: []
      responses:
        '307':
          description: Redirect to `/admin/overview`.
          headers:
            Location:
              description: Always `/admin/overview`.
              schema:
                type: string
                const: /admin/overview
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/{ui_path}:
    parameters:
      - name: ui_path
        in: path
        required: true
        description: SPA route below `/admin/`; see `x-spa-routes`.
        x-greedy: true
        schema:
          type: string
    get:
      operationId: getAdminPage
      tags: [pages]
      summary: Serve the SPA document for an admin route.
      description: |
        Returns 200 for routes in `x-spa-routes` and the same document with status 404 for any other path,
        so that the SPA shows its not-found page. Does not require a session; the SPA signs in itself.
      parameters:
        - name: returnTo
          in: query
          description: Login page only; an `/admin/` path to open after sign-in.
          schema:
            type: string
            maxLength: 2048
        - $ref: '#/components/parameters/SpaQuery'
        - name: state
          in: query
          description: Directory filter state.
          schema:
            $ref: '#/components/schemas/DirectoryState'
        - $ref: '#/components/parameters/SpaPage'
        - name: cleanup
          in: query
          description: Vendor list only; shows the pending-cleanup notice.
          schema:
            type: string
            const: pending
      x-error-codes: []
      responses:
        '200':
          $ref: '#/components/responses/AdminSpaDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/SpaDocumentNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /{vendor}:
    parameters:
      - $ref: '#/components/parameters/Vendor'
    get:
      operationId: getVendorPage
      tags: [pages]
      summary: Serve the SPA document for a published vendor.
      description: |
        Any other single segment (unknown, disabled or deleted vendors, or not a vendor ID at all) returns
        `index.html` with status 404. `/admin` and `/all` have their own routes; the reserved IDs `api`, `assets`
        and `health` return the router-level `404 NOT_FOUND` error.
      parameters:
        - $ref: '#/components/parameters/SpaQuery'
        - $ref: '#/components/parameters/SpaPage'
      x-error-codes: []
      responses:
        '200':
          $ref: '#/components/responses/SpaDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/PublicSpaDocumentNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /{vendor}/{app}:
    parameters:
      - $ref: '#/components/parameters/Vendor'
      - $ref: '#/components/parameters/App'
    get:
      operationId: getAppPage
      tags: [pages]
      summary: Serve the SPA document for a published application.
      description: |
        `/{vendor}/{app}/` (trailing slash) redirects with `308` to `/{vendor}/{app}`. Unknown or unpublished
        applications and invalid identities return `index.html` with status 404. Paths below `/admin/` (other
        than `x-spa-routes`) return `admin.html` with status 404 (see `getAdminPage`); paths whose first segment is
        `api`, `assets` or `health` return the router-level `404 NOT_FOUND` error.
      x-error-codes: []
      responses:
        '200':
          $ref: '#/components/responses/SpaDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/PublicSpaDocumentNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  # ---------------------------------------------------------------- assets
  /assets/{file}:
    parameters:
      - name: file
        in: path
        required: true
        description: A file of the embedded frontend build (`*.js`, `*.css`, `*.woff2`) or the bundled font licence text.
        schema:
          type: string
          pattern: '^[A-Za-z0-9._-]+\.(js|css|woff2|txt)$'
    get:
      operationId: getBuildAsset
      tags: [assets]
      summary: Serve a frontend build file.
      description: |
        `Cache-Control: public, max-age=31536000, immutable`. Fonts also send
        `Access-Control-Allow-Origin: *` because sandboxed instruction documents load them from an opaque origin.
      x-error-codes: [FILE_NOT_FOUND]
      responses:
        '200':
          description: The file.
          content:
            text/javascript:
              schema:
                type: string
            text/css:
              schema:
                type: string
            font/woff2:
              schema:
                type: string
                contentMediaType: font/woff2
            text/plain:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
