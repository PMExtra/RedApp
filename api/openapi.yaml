  /admin/api/apps/{vendor}/{app}/prewarm/jobs:
    parameters:
      - $ref: '#/components/parameters/Vendor'
      - $ref: '#/components/parameters/App'
    post:
      operationId: startPrewarm
      tags: [prewarm]
      summary: Start a one-time prewarm task.
      description: |
        Only one prewarm task runs in the whole service; there is no queue (`409 PREWARM_BUSY` while another runs).
        `request_id` is a client-generated idempotency key: repeating the same request returns the existing job with `200`;
        reusing it with a different body, or after the job expired, returns `409 PREWARM_REQUEST_CONFLICT`.
        Finished jobs are kept for 24 hours; a restart marks a running job `interrupted`. Cancelling never cancels downloads
        that public clients also wait for. Prewarm never counts as public downloads. A disabled application cannot be
        prewarmed (`409 SOURCE_CHANGED`).
      x-idempotency: '`request_id` (32 hex characters) per application, valid while the job is retained.'
      x-polling: The admin UI polls `getPrewarmJob` every 1.5 seconds while `state` is `running`.
      security:
        - sessionCookie: []
          csrfToken: []
      x-max-body-bytes: 8388608
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrewarmStartRequest'
            examples:
              release:
                value:
                  request_id: 9f2c4e0a1b3d5f7e9a1c3e5f7b9d1f3a
                  target: latest
                  platforms: [linux-x64, darwin-arm64]
                  limits: {max_files: 10000, max_depth: 16, max_download_bytes: 10737418240, max_duration_seconds: 3600}
              httpCache:
                value:
                  request_id: 1a2b3c4d5e6f708192a3b4c5d6e7f809
                  paths: [/releases/1.2.3/tool.zip]
                  indexes: [/releases/]
                  match: {type: glob, pattern: '/**/*.zip'}
                  limits: {max_files: 500, max_depth: 4, max_download_bytes: 21474836480, max_duration_seconds: 7200}
      x-error-codes: [APPLICATION_NOT_FOUND, CAPABILITY_UNSUPPORTED, VALIDATION_FAILED, PREWARM_BUSY, PREWARM_REQUEST_CONFLICT, SOURCE_CHANGED, ENTITY_DELETED]
      responses:
        '200':
          description: Existing job for a repeated `request_id`.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrewarmJob'
        '201':
          description: New job started.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrewarmJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
