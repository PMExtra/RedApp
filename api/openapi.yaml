  # ---------------------------------------------------------------- exchange
  /admin/api/configuration/export:
    post:
      operationId: exportConfiguration
      tags: [exchange]
      summary: Export vendors and applications as a configuration ZIP.
      description: |
        `linked` keeps preset references and only overrides; `independent` writes complete effective specs.
        An exported application always includes its parent vendor (independent). Referenced categories and validated
        static icons are included. Never included: hosted and cached files, history, tasks, IDs, revisions, source
        epochs, enabled state, accounts. Private notes and proxy credentials only when requested; when credentials
        are excluded, a proxy URL that contains them is omitted entirely and listed as omitted.
      security:
        - sessionCookie: []
          csrfToken: []
      x-max-body-bytes: 262144
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
            examples:
              vendorWithApps:
                value:
                  selection:
                    - {kind: vendor, key: example, include_apps: true}
                  mode: linked
                  include_notes: false
                  include_proxy_credentials: false
      x-error-codes: [VENDOR_NOT_FOUND, APPLICATION_NOT_FOUND, VALIDATION_FAILED]
      responses:
        '200':
          description: ZIP archive.
          headers:
            Content-Disposition:
              description: '`attachment; filename="redapp-configuration.zip"`'
              schema:
                type: string
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/zip:
              schema:
                type: string
                contentMediaType: application/zip
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/api/configuration/import/preview:
    post:
      operationId: previewImport
      tags: [exchange]
      summary: Upload a configuration package and build an import preview.
      description: |
        Accepts a ZIP or a single YAML document plus optional choices. Changing a choice means uploading again with
        new `choices`; every upload creates a new preview. Previews belong to the session that created them,
        expire after 10 minutes, are kept in memory (at most 8 at once, lost on restart) and never render instructions.
        Packages with unknown files, path traversal, symbolic links, duplicate paths, release distribution or trust
        fields are rejected.
      x-limits:
        upload_bytes: 33554432
        expanded_bytes: 67108864
        entities: 1000
        yaml_document_bytes: 1048576
        image_bytes: 2097152
        choices_bytes: 1048576
      security:
        - sessionCookie: []
          csrfToken: []
      x-max-body-bytes: 34603008
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportUpload'
            encoding:
              file:
                contentType: application/zip, application/yaml, text/yaml, application/octet-stream
              choices:
                contentType: application/json
      x-error-codes: [PACKAGE_INVALID, VALIDATION_FAILED, ALREADY_EXISTS, ENTITY_DELETED, PREVIEW_LIMIT_EXCEEDED]
      responses:
        '200':
          description: Import preview.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportPreview'
              examples:
                needsDecisions:
                  $ref: '#/components/examples/ImportPreviewNeedsDecisions'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/api/configuration/import/{preview_id}/execute:
    parameters:
      - $ref: '#/components/parameters/PreviewId'
    post:
      operationId: executeImport
      tags: [exchange]
      summary: Execute an import preview.
      description: |
        The whole import commits or nothing changes. New vendors and applications are created disabled;
        updated ones keep their enabled state and identity. Idempotent: executing the same preview again within
        24 hours returns the same receipt (also after signing in again) instead of importing twice.
        The preview must be `ready`; if it needs instruction trust, `trust_instructions` must be `true`.
        If the session changed since the preview was built, the import is refused with `404 PREVIEW_NOT_FOUND`.
        If affected objects changed since the preview, `409 PREVIEW_STALE`.
      x-idempotency: The preview ID is the idempotency key; receipts are kept for 24 hours.
      security:
        - sessionCookie: []
          csrfToken: []
      x-max-body-bytes: 8192
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportExecuteRequest'
            examples:
              trusted:
                value:
                  trust_instructions: true
      x-error-codes: [PREVIEW_NOT_FOUND, IMPORT_NOT_READY, INSTRUCTIONS_TRUST_REQUIRED, PREVIEW_STALE, ALREADY_EXISTS, ENTITY_DELETED, VALIDATION_FAILED]
      responses:
        '200':
          description: Import receipt.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/api/apps/{vendor}/{app}/copy:
    parameters:
      - $ref: '#/components/parameters/Vendor'
      - $ref: '#/components/parameters/App'
    post:
      operationId: copyApp
      tags: [exchange]
      summary: Create a new application from an existing one.
      description: |
        `If-Match` is the source application revision and `source_uid` its UID (a mismatch returns
        `409 REVISION_CONFLICT`). The copy is disabled, gets a new UID and no cache, hosted files, history or tasks.
        `linked` keeps the template reference, `independent` writes the effective spec. Notes are copied only with
        `include_notes`, guarded by `notes_revision`. A copy whose proxy is `inherit` follows the target vendor.
        Copies of built-in applications are deletable.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      security:
        - sessionCookie: []
          csrfToken: []
      x-max-body-bytes: 65536
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyRequest'
            examples:
              withNotes:
                value:
                  source_uid: 0123456789abcdef0123456789abcdef
                  target_vendor: example
                  target_id: codex-canary
                  mode: linked
                  include_notes: true
                  notes_revision: 4
      x-error-codes: [APPLICATION_NOT_FOUND, VENDOR_NOT_FOUND, VALIDATION_FAILED, ALREADY_EXISTS, ENTITY_DELETED]
      responses:
        '201':
          description: The new application.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
