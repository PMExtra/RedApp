          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/api/apps/{vendor}/{app}/files/{file_id}:
    parameters:
      - $ref: '#/components/parameters/Vendor'
      - $ref: '#/components/parameters/App'
      - name: file_id
        in: path
        required: true
        description: Hosted file ID (immutable per stored content version).
        schema:
          $ref: '#/components/schemas/Uid'
    delete:
      operationId: deleteHostedFile
      tags: [hosted]
      summary: Delete a hosted file.
      description: |
        Hosted files are immutable versions addressed by ID, so no `If-Match` is needed: a replaced file has a new ID and
        deleting the old ID returns `404 FILE_NOT_FOUND`. Allowed on deleted applications. Running downloads finish first.
      security:
        - sessionCookie: []
          csrfToken: []
      x-error-codes: [APPLICATION_NOT_FOUND, CAPABILITY_UNSUPPORTED, FILE_NOT_FOUND]
      responses:
        '204':
          description: Deleted.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/api/apps/{vendor}/{app}/files/transfers/{transfer_id}:
    parameters:
      - $ref: '#/components/parameters/Vendor'
      - $ref: '#/components/parameters/App'
      - name: transfer_id
        in: path
        required: true
        description: Client-generated transfer ID passed to the upload or import.
        schema:
          $ref: '#/components/schemas/Uid'
    get:
      operationId: getHostedTransfer
      tags: [hosted]
      summary: Read the progress of a running upload or import.
      description: |
        Exists only while the transfer runs; afterwards `404 TRANSFER_NOT_FOUND` (the upload/import response carries the
        outcome). The admin UI polls after 250 ms and then every 750 ms.
      security:
        - sessionCookie: []
      x-error-codes: [APPLICATION_NOT_FOUND, CAPABILITY_UNSUPPORTED, TRANSFER_NOT_FOUND]
      responses:
        '200':
          description: Transfer progress.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostedTransfer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: cancelHostedTransfer
      tags: [hosted]
      summary: Cancel a running upload or import.
      description: The upload or import request then fails with `409 TRANSFER_CANCELLED`. A transfer that is already committing cannot be cancelled (`404`).
      security:
        - sessionCookie: []
          csrfToken: []
      x-error-codes: [APPLICATION_NOT_FOUND, CAPABILITY_UNSUPPORTED, TRANSFER_NOT_FOUND]
      responses:
        '204':
          description: Cancellation requested.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: redapp_session
      description: Administrator session cookie set by `createSession`. Sessions live in memory (lost on restart).
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: The 64 hex character `csrf_token` of the session. Required on every unsafe admin method.

  parameters:
    Vendor:
      name: vendor
      in: path
      required: true
      description: Vendor ID.
      schema:
        $ref: '#/components/schemas/VendorId'
    App:
      name: app
      in: path
      required: true
      description: Application ID within the vendor.
      schema:
        $ref: '#/components/schemas/Slug'
    PreviewId:
      name: preview_id
      in: path
      required: true
      description: Preview ID returned when the preview was created.
      schema:
        $ref: '#/components/schemas/Uid'
    JobId:
      name: job_id
      in: path
      required: true
      description: Prewarm job ID.
      schema:
        $ref: '#/components/schemas/Uid'
    TransferIdQuery:
      name: transfer_id
      in: query
      required: true
      description: Client-generated ID (32 lowercase hex) for progress polling and cancellation; unique among running transfers.
      schema:
        $ref: '#/components/schemas/Uid'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The `ETag` (quoted revision) the client last read.
      schema:
        type: string
        pattern: '^"[1-9][0-9]{0,17}"$'
        examples: ['"7"']
    Page:
      name: page
      in: query
      description: 1-based page number.
      schema:
        type: integer
        minimum: 1
        maximum: 1000000000
        default: 1
    Limit25:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Limit50:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Limit25Cursor:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      description: '`next_cursor` of the previous page; omit for the first page.'
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    SearchQuery:
      name: q
      in: query
      description: Search text, trimmed, at most 128 characters.
      schema:
        type: string
        maxLength: 128
    DirectoryStateQuery:
      name: state
      in: query
      description: Lifecycle filter.
      schema:
        $ref: '#/components/schemas/DirectoryState'
    SourceEpoch:
      name: source_epoch
      in: query
      description: Source epoch to inspect; defaults to the current epoch.
      schema:
        type: integer
        format: int64
        minimum: 1
    HistoryRange:
      name: range
      in: query
      required: true
      description: '`24h` returns raw minute samples; `7d` and `30d` return hourly UTC aggregates.'
      schema:
        type: string
        enum: [24h, 7d, 30d]
    SpaQuery:
      name: q
      in: query
      description: Search text restored by the SPA.
      schema:
        type: string
        maxLength: 128
    SpaCategory:
      name: category
      in: query
      description: Category filter restored by the SPA.
      schema:
        type: string
        maxLength: 63
    SpaPage:
      name: page
      in: query
      description: Page restored by the SPA.
      schema:
        type: string
        maxLength: 10

  headers:
    ETag:
      description: Quoted revision of the returned resource.
      schema:
        type: string
        pattern: '^"[1-9][0-9]{0,17}"$'
    XRequestId:
      description: Request ID generated by the server for this request; also written to logs.
      schema:
        type: string
        pattern: '^[0-9a-f]{16}$'
    Location:
      description: Admin API path of the created resource.
      schema:
        type: string

  responses:
    HealthOk:
      description: Healthy.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthStatus'
    SpaDocument:
      description: The public SPA document `index.html` with a strict Content-Security-Policy.
      headers:
        Content-Security-Policy:
          description: "`default-src 'self'; script-src 'self'; style-src 'self'; frame-ancestors 'none'; base-uri 'none'`"
          schema:
            type: string
      content:
        text/html:
          schema:
            type: string
    AdminSpaDocument:
      description: The administrator SPA document `admin.html` with the same Content-Security-Policy as `SpaDocument`.
      headers:
        Content-Security-Policy:
          description: "`default-src 'self'; script-src 'self'; style-src 'self'; frame-ancestors 'none'; base-uri 'none'`"
          schema:
            type: string
      content:
        text/html:
          schema:
            type: string
    SpaDocumentNotFound:
      description: The administrator SPA document `admin.html` served with status 404 for unknown admin routes.
      content:
        text/html:
          schema:
            type: string
    PublicSpaDocumentNotFound:
      description: The public SPA document `index.html` served with status 404 for unknown or unpublished vendors and applications.
      headers:
        Content-Security-Policy:
          description: Same policy as `SpaDocument`.
          schema:
            type: string
      content:
        text/html:
          schema:
            type: string
    IconFile:
      description: Image bytes.
      headers:
        ETag:
          description: Validator for conditional requests.
          schema:
            type: string
      content:
        image/svg+xml:
          schema:
            type: string
        image/png:
          schema:
            type: string
            contentMediaType: image/png
        image/jpeg:
          schema:
            type: string
            contentMediaType: image/jpeg
    PartialContent:
      description: One byte range of the file.
      headers:
        Content-Range:
          description: '`bytes <start>-<end>/<size>`'
          schema:
            type: string
      content:
        application/octet-stream:
          schema:
            type: string
            contentMediaType: application/octet-stream
    NotModified:
      description: The cached representation is still valid (conditional request). No body.
    InstallerScript:
      description: Installer script.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        text/plain:
          schema:
            type: string
    DistributionFile:
      description: File content; media type depends on the route (see `x-distribution-routes`).
      headers:
        X-Expected-SHA256:
          description: Release artifacts only; verified SHA-256 (hex) of the artifact.
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
        Content-Disposition:
          description: Hosted and HTTP cache files; always `attachment`.
          schema:
            type: string
        ETag:
          description: Hosted (`"sha256-<hex>"`) and HTTP cache files.
          schema:
            type: string
        Last-Modified:
          description: Hosted and HTTP cache files.
          schema:
            type: string
        Accept-Ranges:
          description: '`bytes` for hosted and HTTP cache files, `none` for release routes.'
          schema:
            type: string
      content:
        application/octet-stream:
          schema:
            type: string
            contentMediaType: application/octet-stream
        application/json:
          schema:
            type: string
        text/plain:
          schema:
            type: string
        application/pgp-signature:
          schema:
            type: string
    BadRequest:
      description: The request is malformed or invalid.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: {code: VALIDATION_FAILED, message: 'cache_ttl_seconds must be between 0 and 86400', request_id: 4f2a9c0d1e3b5a7c, retryable: false}
    Unauthorized:
      description: No valid session, or wrong password.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: {code: AUTH_REQUIRED, message: Sign in required, request_id: 4f2a9c0d1e3b5a7c, retryable: false}
    Forbidden:
      description: Origin or CSRF check failed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: {code: CSRF_REJECTED, message: CSRF validation failed, request_id: 4f2a9c0d1e3b5a7c, retryable: false}
    NotFound:
      description: The addressed object does not exist or is not visible.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: {code: APPLICATION_NOT_FOUND, message: Application not found, request_id: 4f2a9c0d1e3b5a7c, retryable: false}
    MethodNotAllowed:
      description: Router-level; the path exists but not for this method. `Allow` lists the methods.
      headers:
        Allow:
          description: Allowed methods.
          schema:
            type: string
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The request conflicts with the current state.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: {code: REVISION_CONFLICT, message: Changed by someone else; reload before saving, request_id: 4f2a9c0d1e3b5a7c, retryable: false}
    PayloadTooLarge:
      description: Request body, upload or artifact exceeds its limit.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: Wrong request `Content-Type`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate or capacity limit; retry later.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          description: Seconds until a retry may succeed, when known.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected server error (recovered panic).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadGateway:
      description: An upstream failed or returned untrusted data.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Local storage, capacity or a dependency is temporarily unavailable.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          description: Seconds until a retry may succeed, when known.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    GatewayTimeout:
      description: '`only-if-cached` request for a file that is not cached.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  x-error-code-groups:
    common:
      applies_when: every operation
      codes: [INVALID_PATH, INVALID_QUERY, REQUEST_ORIGIN_INVALID, INTERNAL_ERROR, STORAGE_UNAVAILABLE]
    admin_origin:
      applies_when: path starts with `/admin/api/`
      codes: [ORIGIN_REJECTED]
    session:
      applies_when: operation security requires `sessionCookie`
      codes: [AUTH_REQUIRED]
    csrf:
      applies_when: operation security requires `csrfToken`
      codes: [CSRF_REJECTED]
    json_body:
      applies_when: operation has an `application/json` request body
      codes: [INVALID_REQUEST, UNSUPPORTED_MEDIA_TYPE, PAYLOAD_TOO_LARGE]
    multipart_body:
      applies_when: operation has a `multipart/form-data` request body
      codes: [INVALID_REQUEST, UNSUPPORTED_MEDIA_TYPE, PAYLOAD_TOO_LARGE]
    if_match:
      applies_when: operation declares the `If-Match` parameter
      codes: [IF_MATCH_REQUIRED, REVISION_CONFLICT]
  x-router-error-codes:
    description: Returned by the router before an operation is selected.
    codes: [NOT_FOUND, METHOD_NOT_ALLOWED, INVALID_PATH, REQUEST_ORIGIN_INVALID]
  x-error-codes:
    INVALID_REQUEST: {status: 400, retryable: false, description: 'Body is not valid strict JSON or multipart: invalid UTF-8, duplicate keys, unknown fields, wrong types, null where not allowed, trailing data, missing or misordered multipart parts.'}
    VALIDATION_FAILED: {status: 400, retryable: false, description: 'Body is well-formed but a value is invalid (range, format, provider rules, unknown referenced object such as an icon or category). `message` names the field.'}
    INVALID_QUERY: {status: 400, retryable: false, description: Unknown, repeated, empty or invalid query parameter.}
    INVALID_CURSOR: {status: 400, retryable: false, description: Cursor is malformed or belongs to another endpoint, application, source epoch or filter.}
    INVALID_PATH: {status: 400, retryable: false, description: Non-canonical path, invalid identity segment, invalid file path or query string on a file route.}
    REQUEST_ORIGIN_INVALID: {status: 400, retryable: false, description: Invalid `Host` or malformed forwarding headers from a trusted proxy.}
    IF_MATCH_REQUIRED: {status: 400, retryable: false, description: '`If-Match` is missing or not a quoted positive revision.'}
    CURRENT_PASSWORD_INCORRECT: {status: 400, retryable: false, description: The current password is wrong.}
    PASSWORD_INVALID: {status: 400, retryable: false, description: The new password is not 12 to 72 bytes long.}
    PROXY_REDACTED_MISMATCH: {status: 400, retryable: false, description: 'The redacted password `****` was submitted for a proxy whose scheme, user or host differs from the saved one.'}
    ICON_INVALID: {status: 400, retryable: false, description: Unsupported image format, unsafe SVG or raster dimensions over the limit.}
    PACKAGE_INVALID: {status: 400, retryable: false, description: 'Configuration package is malformed, exceeds a limit or contains forbidden content (unknown files, traversal, links, distribution or trust fields).'}
    INSTRUCTIONS_TRUST_REQUIRED: {status: 400, retryable: false, description: The import changes usage instructions and `trust_instructions` is not `true`.}
    AUTH_REQUIRED: {status: 401, retryable: false, description: No valid session; sign in again.}
    LOGIN_FAILED: {status: 401, retryable: false, description: Wrong administrator password.}
    ORIGIN_REJECTED: {status: 403, retryable: false, description: '`Origin` header differs from the request origin.'}
    CSRF_REJECTED: {status: 403, retryable: false, description: '`X-CSRF-Token` missing or wrong.'}
    NOT_FOUND: {status: 404, retryable: false, description: No route matches the path.}
    VENDOR_NOT_FOUND: {status: 404, retryable: false, description: Vendor does not exist (public routes also when not published).}
    APPLICATION_NOT_FOUND: {status: 404, retryable: false, description: Application does not exist (public routes also when not published).}
    CATEGORY_NOT_FOUND: {status: 404, retryable: false, description: Category does not exist.}
    FILE_NOT_FOUND: {status: 404, retryable: false, description: 'No file at this path or ID (hosted file, distribution path, asset).'}
    SOURCE_NOT_FOUND: {status: 404, retryable: false, description: '`source_epoch` does not exist for this application.'}
    PREVIEW_NOT_FOUND: {status: 404, retryable: false, description: Preview or receipt is unknown, expired, belongs to another session or source; build a new preview.}
    JOB_NOT_FOUND: {status: 404, retryable: false, description: Prewarm job is unknown or expired (finished jobs are kept 24 hours).}
    TRANSFER_NOT_FOUND: {status: 404, retryable: false, description: No running transfer with this ID.}
    CACHE_ENTRY_NOT_FOUND: {status: 404, retryable: false, description: The path is not cached in the current source epoch.}
    CAPABILITY_UNSUPPORTED: {status: 404, retryable: false, description: 'The application''s provider does not support this endpoint (for example versions of an HTTP cache application).'}
    METHOD_NOT_ALLOWED: {status: 405, retryable: false, description: Path exists but not for this method.}
    REVISION_CONFLICT: {status: 409, retryable: false, description: '`If-Match` revision (or a body identity guard such as `confirm_uid`, `source_uid`, `notes_revision`) is stale; keep the draft and reload.'}
    ALREADY_EXISTS: {status: 409, retryable: false, description: The vendor or application ID is taken (including by a deleted object pending cleanup).}
    VENDOR_NOT_EMPTY: {status: 409, retryable: false, description: The vendor still has applications.}
    BUILTIN_PROTECTED: {status: 409, retryable: false, description: Built-in vendors and applications cannot be deleted; disable them instead.}
    ENTITY_DELETED: {status: 409, retryable: false, description: The vendor or application is deleted or being deleted and is read-only.}
    APPLICATION_DELETE_PENDING: {status: 409, retryable: true, description: Deletion started but the application's work did not stop within 15 seconds; retry the deletion.}
    CATEGORY_AMBIGUOUS: {status: 409, retryable: false, description: A typed category name matches more than one existing category; choose one.}
    FILE_CONFLICT: {status: 409, retryable: false, description: 'Hosted file at the path changed: create found an existing file, or replace `expected_id` is not the current file.'}
    TRANSFER_ID_IN_USE: {status: 409, retryable: false, description: Another running transfer uses this `transfer_id`.}
    TRANSFER_CANCELLED: {status: 409, retryable: false, description: The upload or import was cancelled.}
    PREVIEW_STALE: {status: 409, retryable: false, description: 'Source, policy, channels or affected objects changed since the preview; nothing was changed, build a new preview.'}
    OPERATION_IN_PROGRESS: {status: 409, retryable: true, description: The preview or job is currently running.}
    SOURCE_CHANGED: {status: 409, retryable: true, description: The application source changed or is being published during the request; retry.}
    IMPORT_NOT_READY: {status: 409, retryable: false, description: 'Import preview still has unresolved `requirements`; upload again with choices.'}
    PREWARM_BUSY: {status: 409, retryable: true, description: Another prewarm task is running in the service.}
    PREWARM_REQUEST_CONFLICT: {status: 409, retryable: false, description: '`request_id` was used with a different body or its job expired; generate a new ID.'}
    ARTIFACT_TOO_LARGE: {status: 413, retryable: false, description: File exceeds `max_artifact_bytes`.}
    PAYLOAD_TOO_LARGE: {status: 413, retryable: false, description: Request body exceeds the operation limit.}
    UNSUPPORTED_MEDIA_TYPE: {status: 415, retryable: false, description: Request `Content-Type` is not the one the operation accepts.}
    LOGIN_RATE_LIMITED: {status: 429, retryable: true, description: Too many sign-in attempts; wait.}
    PREVIEW_LIMIT_EXCEEDED: {status: 429, retryable: true, description: Too many active import previews (8); wait for expiry.}
    INTERNAL_ERROR: {status: 500, retryable: false, description: Unexpected server error; report the request ID.}
    UPSTREAM_UNAVAILABLE: {status: 502, retryable: true, description: 'Upstream unreachable, timed out or returned 5xx.'}
    METADATA_UNTRUSTED: {status: 502, retryable: false, description: Upstream release metadata failed verification (digest, signature, URL rules).}
    CHANNELS_UNVERIFIED: {status: 502, retryable: true, description: Release channels could not be fetched and verified; nothing was selected or deleted.}
    IMPORT_SOURCE_FAILED: {status: 502, retryable: true, description: The hosted file import URL could not be downloaded.}
    STORAGE_UNAVAILABLE: {status: 503, retryable: true, description: Database or data directory failed.}
    NOT_READY: {status: 503, retryable: true, description: Readiness check failed.}
    SESSION_LIMIT_EXCEEDED: {status: 503, retryable: true, description: 128 sessions are active.}
    TRANSFER_CAPACITY: {status: 503, retryable: true, description: Reader or writer slots (`max_readers`/`max_writers`) are exhausted; no queue.}
    CACHE_CONTENDED: {status: 503, retryable: true, description: The cached copy kept changing during the request.}
    PREVIEW_BUSY: {status: 503, retryable: true, description: Eight maintenance previews are being built.}
    INSTALLER_UNAVAILABLE: {status: 503, retryable: false, description: The embedded installer failed its integrity check.}
    CACHE_MISS: {status: 504, retryable: false, description: '`Cache-Control: only-if-cached` and the file is not cached.'}

  examples:
    AppConfigurationLinked:
      summary: Built-in Codex application with two overrides.
      value:
        revision: 7
        template_ref: openai/codex
        template_hash: 3c9d0f7e2b1a4c6d8e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d
        template_missing: false
        defaults:
