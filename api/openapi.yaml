        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteApp
      tags: [directory]
      summary: Permanently delete a custom application.
      description: |
        Removes the application's cache, hosted files, history and tasks and interrupts its transfers.
        Built-in applications cannot be deleted. `confirm_uid` must equal the application UID, so a deletion
        never hits a different application recreated under the same key.

        The application first becomes read-only, then RedApp waits up to 15 seconds for its work to stop.
        If work is still running the response is `409 APPLICATION_DELETE_PENDING` (retryable); the application
        stays read-only and the deletion completes on retry or at the next start.
        Retrying after a successful deletion (no application with this key) returns `404 APPLICATION_NOT_FOUND`;
        clients treat that as done. `If-Match` is not checked again when retrying a pending deletion.
      x-timeout: The request may block for up to 15 seconds while application work stops.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - name: confirm_uid
          in: query
          required: true
          description: UID of the application being deleted; a mismatch returns `409 REVISION_CONFLICT`.
          schema:
            $ref: '#/components/schemas/Uid'
      security:
        - sessionCookie: []
          csrfToken: []
      x-error-codes: [APPLICATION_NOT_FOUND, BUILTIN_PROTECTED, APPLICATION_DELETE_PENDING]
      responses:
        '200':
          description: Deleted. File cleanup may continue in the background.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDeletion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
