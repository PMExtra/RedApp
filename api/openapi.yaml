      operationId: previewVersionCleanup
      tags: [releases]
      summary: Preview removal of cached versions below a minimum version.
      description: |
        Freezes the set of current complete generations whose version is lower than `minimum_version` in the selected
        source epoch (default: current). Versions that cannot be compared are listed in `unknown_versions` and kept.
