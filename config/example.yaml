# Optional /etc/redapp/config.yaml. Every field below has a built-in default.
# CLI > environment > this selected file > defaults. Lists replace, not merge.
# Matches v0.6.3; older versions use their tagged examples.
schema_version: 1
listen: ':8080'
data_dir: /var/lib/redapp
trusted_proxies: []
download_limits:
  max_writers: 16
  max_readers: 512
  # Per artifact, not total cache usage. GB = 10^9 bytes; GiB = 2^30 bytes.
  max_artifact_bytes: '4GiB'
