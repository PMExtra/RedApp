{
  "schema_version": 1,
  "kind": "App",
  "metadata": {
    "id": "dotultimate",
    "vendor": "jetbrains"
  },
  "spec": {
    "name": {
      "en": "dotUltimate",
      "zh-CN": "dotUltimate"
    },
    "description": {
      "en": "Windows .NET tool suite distributed as one complete offline ZIP, separate from the standalone Rider IDE.",
      "zh-CN": "Windows .NET 工具套装，完整离线 ZIP 整体分发，与独立 Rider IDE 并存。"
    },
    "icon": "",
    "provider": "json-release",
    "categories": [],
    "tags": [],
    "json_release": {
      "default_channel": "stable",
      "refresh_seconds": 3600,
      "channels": {
        "stable": {
          "requests": [
            {
              "url": "https://data.services.jetbrains.com/products/releases?code=RSU&latest=true&type=release",
              "context": {
                "product": "RSU"
              }
            }
          ],
          "query": ".body[.context.product][0] as $r | $r.downloads.windowsZIP as $a | if $a == null then error(\"offline suite ZIP metadata is required; do not substitute the web installer\") elif ($a.link | endswith(\".zip\") | not) then error(\"offline suite must be a complete ZIP\") else {version:$r.version,build:$r.build,artifacts:[{key:\"windows-offline-suite\",os:\"windows\",arch:\"unknown\",format:\"zip\",variant:\"offline-suite\",url:$a.link,size:$a.size,checksum_url:$a.checksumLink,checksum_filename:($a.link | split(\"/\") | last)}]} end"
        }
      },
      "sources": {
        "metadata": [
          {
            "origin": "https://data.services.jetbrains.com",
            "prefix": "/products/"
          }
        ],
        "artifacts": [
          {
            "origin": "https://download.jetbrains.com",
            "prefix": "/resharper/"
          },
          {
            "origin": "https://download-cdn.jetbrains.com",
            "prefix": "/resharper/"
          }
        ],
        "checksums": [
          {
            "origin": "https://download.jetbrains.com",
            "prefix": "/resharper/"
          },
          {
            "origin": "https://download-cdn.jetbrains.com",
            "prefix": "/resharper/"
          }
        ]
      },
      "prewarm": []
    },
    "instructions": {
      "en": "The RSU product supplies the complete offline suite as downloads.windowsZIP. Download and preserve the whole ZIP, including its EXE and .dat; never mirror only the EXE or substitute windowsWeb, windowsWebLP or toolboxWindows. No duplicate artifacts are registered for suite components. Architecture remains unknown. Validate the package and offline installation before enabling prewarm; metadata and checksum validation alone do not verify archive contents. These downloads do not reconfigure the IDE’s built-in updater.",
      "zh-CN": "RSU 产品通过 downloads.windowsZIP 提供完整离线套件。下载并保留整个 ZIP（包括 EXE 和 .dat），不单独分发 EXE，不以 windowsWeb、windowsWebLP 或 toolboxWindows 替代，不为套装子组件重复登记制品。架构保持未知。启用预热前须验证安装包及离线安装；元数据与校验文件验证不代表归档内容已验证。这些下载不会修改 IDE 自带更新器。"
    }
  }
}
