{
  "schema_version": 1,
  "kind": "App",
  "metadata": {
    "id": "dotultimate",
    "vendor": "jetbrains"
  },
  "spec": {
    "name": {
      "en": "dotUltimate",
      "zh-CN": "dotUltimate"
    },
    "description": {
      "en": "dotUltimate is a suite of tools for .NET and C++ development, code analysis and profiling.",
      "zh-CN": "dotUltimate 是用于 .NET 和 C++ 开发、代码分析与性能分析的工具套装。"
    },
    "icon": "assets/jetbrains/dotultimate/icon.svg",
    "provider": "json-release",
    "categories": [],
    "tags": [],
    "json_release": {
      "default_channel": "stable",
      "refresh_seconds": 3600,
      "channels": {
        "stable": {
          "requests": [
            {
              "url": "https://data.services.jetbrains.com/products/releases?code=RSU&latest=true&type=release",
              "context": {
                "product": "RSU"
              }
            }
          ],
          "query": ".body[.context.product][0] as $r | $r.downloads.windowsZIP as $a | if $a == null then error(\"offline suite ZIP metadata is required; do not substitute the web installer\") elif ($a.link | endswith(\".zip\") | not) then error(\"offline suite must be a complete ZIP\") else {version:$r.version,build:$r.build,artifacts:[{key:\"windows-offline-suite\",os:\"windows\",arch:\"unknown\",format:\"zip\",variant:\"offline-suite\",url:$a.link,size:$a.size,checksum_url:$a.checksumLink,checksum_filename:($a.link | split(\"/\") | last)}]} end"
        }
      },
      "sources": {
        "metadata": [
          {
            "origin": "https://data.services.jetbrains.com",
            "prefix": "/products/"
          }
        ],
        "artifacts": [
          {
            "origin": "https://download.jetbrains.com",
            "prefix": "/resharper/"
          },
          {
            "origin": "https://download-cdn.jetbrains.com",
            "prefix": "/resharper/"
          }
        ],
        "checksums": [
          {
            "origin": "https://download.jetbrains.com",
            "prefix": "/resharper/"
          },
          {
            "origin": "https://download-cdn.jetbrains.com",
            "prefix": "/resharper/"
          }
        ]
      },
      "prewarm": []
    },
    "instructions": {
      "en": "",
      "zh-CN": ""
    }
  }
}
